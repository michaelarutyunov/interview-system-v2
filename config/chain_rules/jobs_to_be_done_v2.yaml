# Chain rules for JTBD V3 (5-level ontology)
#
# Direction-based rules replace node-type pair allowlists (pre-April 2026).
# Each chain-relevant edge type specifies a direction constraint evaluated
# against the source and target node's ontology levels (L0–L4).
#
# Directions:
#   upward            — src_level < tgt_level (moving toward terminal L4)
#   upward_or_lateral — src_level <= tgt_level (allows same-level elaboration)
#   reverse           — flip direction (solution→pain becomes pain→solution),
#                        included as inferred chain link with confidence 0.6
#   unconstrained      — all edges of this type pass (backward compat)
#
# Downward edges (addresses, achieves) are included via reverse to recover
# pain→solution and gain→solution links that respondents imply but the
# extraction captures in the opposite direction.
#
# Chain spine (upward):
#   L0 context/trigger → L1 pain/gain → L2 job_statement → L3 emotional/social → L4 solution

chain_edges:
  triggers: upward
  implies: upward
  supports: upward_or_lateral
  drives: upward
  addresses: reverse
  achieves: reverse
