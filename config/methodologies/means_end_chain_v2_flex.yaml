# Means-End Chain Methodology Configuration (V2 Flex)
#
# DESIGN RATIONALE:
#   MEC flex shares identical strategy architecture with MEC strict (v2_strict).
#   The ONLY material difference is extraction semantics: flex removes the
#   permitted_connections whitelist on leads_to, allowing the LLM to create
#   direct edges between non-adjacent ontology levels (e.g., attribute → value).
#
#   This produces different graph topology from the same respondent speech:
#   - Strict: LLM forced to create intermediate nodes → bridge fires rarely
#   - Flex:   LLM creates skip edges → bridge fires for level skips
#
#   The strategies respond to whatever graph they receive. In practice, flex
#   produces more bridge opportunities (more level skips detected) but identical
#   interview moderation logic. Flex is epistemically more honest (reflects what
#   was said); strict makes chain_completion metrics more interpretable.
#
#   All signal weights and valid_when gates are identical to v2_strict because
#   the graph operations are the same — only the extraction layer differs.
#
# CHANGES FROM LEGACY V3 FLEX:
#   - Removed legacy strategies (deepen, clarify, explore, reflect)
#   - Retained 6 chain-aware strategies: ascend, ground, bridge, branch, anchor, revitalize
#   - Added convgraph.node.novelty, focus_count, canonical_novelty signals
#   - Added chain foundation signals (has_attribute_foundation, has_terminal_apex)
#   - Added intellectual_engagement signal
#   - Strengthened repetition penalties on structural strategies
#   - Added engagement soft-brake on ascend
#
# USE THIS VARIANT WHEN:
#   - Respondents compress reasoning (jump from attribute to value in one breath)
#   - You want the graph to reflect what was said, not what must be true
#   - You expect non-linear MEC chains in respondent language

method:
  name: means_end_chain_v2_flex
  version: "2.0"
  goal: "Explore causal chains from concrete attributes to abstract values"
  opening_bias: "Elicit concrete, experience-based responses. Ask for specific examples and situations."
  description: "Laddering: attributes → consequences → values (flex: LLM-determined connections)"

ontology:
  nodes:
    - name: attribute
      level: 1
      terminal: false
      description: "A feature or property of the product/service itself — what it is, contains, or does by design, independent of any user outcome. If it can be described without mentioning a person, it's an attribute."
      non_attribute_examples:
        - "Any outcome the person experiences, does, or avoids as a result of using it — that's a functional_consequence, not an attribute"
        - "Any behavior the person performs ('I do X', 'I avoid Y') — the product enabling it is an attribute; the behavior itself is a functional_consequence"
        - "Any feeling or self-perception triggered by use — that's psychosocial_consequence, not an attribute"

    - name: functional_consequence
      level: 2
      terminal: false
      description: "A practical outcome of using the product — what the person experiences, can do, avoids, or achieves as a result. If it answers 'what happens when you use it?', it's functional."

    - name: psychosocial_consequence
      level: 3
      terminal: false
      description: "The emotional, identity, or social meaning of an outcome — how it affects self-image, confidence, relationships, or how others perceive the person. If it answers 'how does that make you feel, or how does it affect how others see you?', it's psychosocial."

    - name: instrumental_value
      level: 4
      terminal: false
      description: "A personal standard the respondent holds themselves to — the behavioral norm their choices reflect. Often expressed through contrast rather than direct declaration: 'not settling', 'rather than compromising', 'instead of just accepting whatever' all signal a standard as clearly as 'I try to be discerning'. Ask: does this describe a standard of behavior they are protecting, whether stated positively ('being discerning') or by negating its opposite ('not willing to settle for less')? If yes, it is instrumental_value. Consumer contexts: autonomy, quality standards, identity consistency."

    - name: terminal_value
      level: 5
      terminal: true
      description: "The end-state of being the respondent is ultimately trying to achieve or protect — an identity, feeling, or way of experiencing life they care about. Ask: if you kept asking 'why does that matter?', does this feel like the final answer? Sounds like: 'feeling like myself', 'being in control of my own choices', 'feeling respected', 'living how I want to'. Only extract when explicitly stated by the respondent OR when a clear instrumental_value (L4) already exists in the chain and this end-state is unambiguously implied by it."

  edges:
    # FLEX: no permitted_connections — the LLM decides which node-type pairs can
    # connect based on the respondent's expressed reasoning. The semantic meaning
    # of leads_to remains "causal or enabling relationship."
    - name: leads_to
      description: "Causal or enabling relationship — connects any two nodes where one drives, enables, or results in the other. The LLM determines which node pairs can connect based on the respondent's expressed reasoning."
      chain_relevant: true

    - name: revises
      description: "Contradiction - newer belief supersedes older one"
      chain_relevant: false
      permitted_connections:
        - ["*", "*"]

  extraction_guidelines:
    - "Extract BOTH explicit AND implicit relationships — MEC chains are often implied rather than stated"
    - "Explicit: Look for causal markers like 'because', 'so', 'that's why', 'leads to', 'which means'"
    - "Implicit: When multiple concepts co-occur in a response, connect them if they form a logical means-end chain"
    - "Contextual: If the interviewer asks 'why does X matter' and the response describes Y, create X→Y relationship"
    - "Chain direction: attribute → functional_consequence → psychosocial_consequence → instrumental_value → terminal_value"
    - "instrumental_value (L4) — three extraction pathways: (1) Positive declaration: 'being the kind of person who', 'it matters to me to', 'I try to', 'I believe in', 'I value', 'I care about', 'I make a point of'; (2) Negation/contrast: 'I don't want to settle', 'rather than compromising', 'instead of just accepting', 'not willing to make do', 'not someone who just goes with whatever' — these express the same behavioral standard as positive declarations, stated in reverse; (3) Bounded inference from L3: when a psychosocial consequence clearly implies a behavioral standard via MEC laddering logic, extract the implied instrumental_value even if the respondent did not name it explicitly — e.g. 'I feel guilt-free' implies a standard like 'making choices I can stand behind'. Label the standard, not the feeling."
    - "terminal_value (L5) — strict extraction: only when the respondent explicitly names an end-state of being ('feeling like myself', 'being in control', 'feeling respected', 'just wanting to feel X', 'living on my own terms'), OR when a clear instrumental_value (L4) node already exists in the chain and the terminal state is unambiguously implied by it. Do NOT make two-level leaps directly from L3 to L5."
    - "FLEX MODE: respondents often compress levels. If they jump directly from attribute to value, create that edge rather than forcing intermediate nodes. The bridge strategy will detect level skips and fill them if needed."
    - "Target 2-3x more edges than nodes — prefer creating relationships over leaving concepts disconnected"
    - "CRITICAL — attribute vs functional_consequence boundary: Ask 'can this be described without mentioning a person?' If yes → attribute. If it describes what the person experiences, does, or avoids → functional_consequence"

  extractability_criteria:
    extractable_contains:
      - "Product attributes, features, or characteristics"
      - "Benefits, outcomes, or consequences"
      - "Feelings, emotions, or social implications"
      - "Values or life goals"
      - "Causal relationships between any of the above"
    non_extractable_contains:
      - "Simple yes/no responses"
      - "Acknowledgments ('okay', 'I see')"
      - "Questions back to the interviewer"
      - "Off-topic tangents"
      - "Very short responses with no substance"

  concept_naming_convention: >
    Name each concept according to its level in the means-end chain:
    attributes as product features or characteristics (describable without mentioning a person),
    functional consequences as practical outcomes the person experiences or achieves,
    psychosocial consequences as emotional or social meanings,
    instrumental values as principles or modes of being ('being X', 'acting X'),
    terminal values as fundamental life goals or end-states.

signals:
  graph:
    - convgraph.state.node.count
    - convgraph.state.max_depth
    - convgraph.state.node.orphan_count
    - convgraph.chain.completion
    # Canonical graph signals (Phase 4, experimental)
    - canongraph.state.node.count
    - canongraph.state.edge.density
    - canongraph.state.exhaustion
    # Note: Node-level chain topology signals are auto-discovered
    # from strategy signal_weights and do not need to be listed here.
    # Per-concept-derived node signals (added by f965 migration):
    - convgraph.node.llm.elaboration
    - convgraph.node.llm.charge
    - convgraph.node.llm.has_quality_data

  llm:
    - response.semantic.llm.certainty
    - response.semantic.llm.engagement
    - response.semantic.llm.elaboration
    - response.semantic.llm.charge
    # Note: response.semantic.llm.engagement.trend is session-scoped and managed separately
    # Per-concept LLM signals (elaboration, charge) produce per-concept ratings that route to graph.node.* via Stage 6 bridge.

  temporal:
    - interview.strategy.self_count
    - interview.strategy.turns_since_change

  meta:
    - interview.phase
    - meta.saturation.conversation
    - meta.saturation.canonical

strategies:
  # Strategy 1: Revitalize — conversation-level fallback for fatigue/disengagement
  - name: revitalize
    node_binding: none
    description: "Shift to fresh topics when response trend shows fatigue or repeated shallow answers"
    signal_weights:
      # Engagement domain — revitalize owns engagement signals exclusively
      response.semantic.llm.engagement.low: 0.50
      response.semantic.llm.engagement.trend.shallowing: 0.30
      response.semantic.llm.engagement.trend.fatigued: 0.80
      # Saturation — don't re-engage if conversation is saturated
      meta.saturation.conversation: -0.40
      meta.saturation.canonical: -0.40
      # Brake
      interview.strategy.self_count: -0.50

  # Strategy 2: Ascend — extend incomplete chain upward toward terminal values
  - name: ascend
    description: "Extend an incomplete chain upward by asking what the current concept leads to at the next ontology level"
    node_binding: required
    valid_when: convgraph.node.chain.gap.above
    bridge_direction: forward
    bridge_target: most_abstract
    extraction_mode: extract_new
    level_guidance:
      instrumental_value: "You are laddering FROM an instrumental value — a personal standard the respondent holds. Your question must ask what deeper end-state or sense of being this standard ultimately serves: what does living by this value allow the respondent to feel or be? Do NOT return to physical attributes, functional consequences, or psychosocial feelings — those are below the current level. Push upward toward the terminal end-state."
    signal_weights:
      convgraph.node.chain.gap.above.true: 0.25
      convgraph.node.chain.fan_in: 0.067
      convgraph.node.recency: 0.2
      convgraph.node.exhaustion: -0.6
      convgraph.node.focus.count.high: -0.4
      convgraph.node.focus.count.medium: -0.2
      # f965: response_depth.deep (0.1) + intellectual_engagement.high × 0.5 (0.1) → elaboration.high 0.2
      convgraph.node.llm.elaboration.high: 0.2
      # f965: intellectual_engagement.high × 0.5 (0.1) → charge.positive 0.1
      convgraph.node.llm.charge.positive: 0.1
      response.semantic.llm.engagement.low: -0.3
      interview.strategy.self_count: -0.15
      convgraph.node.chain.has_attribute_foundation.true: 0.4
      convgraph.node.chain.has_attribute_foundation.false: -0.5

  # Strategy 3: Ground — establish causal antecedents for ungrounded high-level node
  - name: ground
    description: "Ground an ungrounded node by asking what attributes or lower-level concepts directly cause or enable it — probe causal antecedents, not retrospective comparisons or general context"
    node_binding: required
    valid_when: convgraph.node.chain.gap.below
    bridge_direction: backward
    bridge_target: most_concrete
    extraction_mode: extract_new
    signal_weights:
      convgraph.node.chain.gap.below.true: 0.3
      convgraph.node.recency: 0.25
      convgraph.node.exhaustion: -0.4
      # f965: response.semantic.llm.response_depth.deep (0.05) → convgraph.node.llm.elaboration.high
      convgraph.node.llm.elaboration.high: 0.05
      interview.strategy.self_count: -0.40
      convgraph.node.chain.has_attribute_foundation.false: 0.4
      convgraph.node.chain.has_attribute_foundation.true: -0.2
      meta.saturation.conversation.high: -0.40
      meta.saturation.canonical.high: -0.30

  # Strategy 4: Bridge — fill missing intermediate level in a skipped chain
  # NOTE: Bridge fires more often in flex than strict because flex allows
  # level-skipping edges from extraction. This is by design — the bridge
  # strategy catches what the respondent compressed and probes for intermediates.
  - name: bridge
    description: "Fill a structural gap by asking what happens between a lower and higher concept that are directly connected but skip ontology levels"
    node_binding: required
    valid_when: convgraph.node.chain.level.skip
    bridge_direction: forward
    bridge_target: most_abstract
    extraction_mode: extract_new
    signal_weights:
      convgraph.node.chain.level.skip.true: 0.35
      convgraph.node.recency: 0.2
      convgraph.node.exhaustion: -0.3
      interview.strategy.self_count: -0.15

  # Strategy 5: Branch — expand breadth at attribute level
  - name: branch
    description: "Elicit additional product attributes or features at the same level — ask what other concrete characteristics of the product the respondent experiences or values"
    node_binding: required
    valid_when: convgraph.node.chain.branching_deficit
    bridge_direction: forward
    bridge_target: most_concrete
    extraction_mode: extract_new
    signal_weights:
      convgraph.node.chain.branching_deficit: 0.25
      convgraph.node.recency: 0.15
      convgraph.node.exhaustion: -0.3
      response.semantic.llm.engagement.high: 0.1
      interview.strategy.self_count: -0.50  # dbj3: strengthened from -0.15
      convgraph.node.chain.has_attribute_foundation.true: 0.1   # 28ub: reduced from 0.30
      convgraph.node.chain.has_terminal_apex.true: 0.5

  # Strategy 6: Anchor — connect isolated node to existing graph structure
  - name: anchor
    description: "Connect an isolated concept to the existing graph by exploring how it relates to other known concepts"
    node_binding: required
    valid_when: convgraph.node.is_orphan
    bridge_direction: forward
    bridge_target: either
    extraction_mode: prefer_existing
    signal_weights:
      convgraph.node.is_orphan.true: 0.50
      convgraph.node.recency: 0.2
      convgraph.node.exhaustion: -0.2
      interview.strategy.self_count: -0.15
      meta.saturation.conversation.high: -0.40
      meta.saturation.canonical.high: -0.30

chain_completion:
  expected_branching:
    attribute: 3
    functional_consequence: 2
    psychosocial_consequence: 1
    instrumental_value: 1
    terminal_value: 1
  score_threshold: 0.15  # Production threshold — below this, conversation-level strategies may activate

phases:
  early:
    description: "Initial exploration, building graph structure"
    signal_weights:
      branch: 1.4
      ascend: 1.0
      ground: 1.4
      bridge: 0.8
      anchor: 1.2
      revitalize: 1.0
    phase_bonuses:
      branch: 0.1

  mid:
    description: "Building depth and connections"
    signal_weights:
      ascend: 1.4  # mpwk: boosted from 1.3 — R1+R2 insufficient, ascend needs more mid-phase mass
      ground: 1.3
      bridge: 1.2
      branch: 1.0
      anchor: 1.0
      revitalize: 1.0

  late:
    description: "Validation and verification"
    signal_weights:
      ascend: 1.5
      ground: 0.9
      bridge: 1.3
      branch: 1.1
      anchor: 0.7
      revitalize: 1.2
    phase_bonuses:
      revitalize: 0.2
      ascend: 0.10
      bridge: 0.05
      branch: 0.10
