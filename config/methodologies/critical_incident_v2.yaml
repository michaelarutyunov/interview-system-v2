# Critical Incident Technique Methodology Configuration (V2)
#
# Refitted from legacy critical_incident.yaml to the chain-aware strategy
# architecture established by MEC strict (means_end_chain_v2_strict.yaml).
#
# Design rationale:
#   CIT has an inherent narrative hierarchy:
#     incident (L1) → situation (L2) → action (L3) → outcome (L4)
#       → emotion (L5) / learning (L5) / behavior_change (L5, terminal)
#
#   This maps well to the MEC ladder pattern. We retain 5 of the 6 MEC
#   structural strategies (ascend, ground, bridge, anchor, revitalize) because
#   both CIT and MEC are laddering instruments. We add two CIT-specific
#   conversation-level strategies:
#     - elicit_narrative: opens new stories, replaces the old elicit_incident
#     - close: confirms the narrative arc end-to-end
#
#   Key differences from MEC strict:
#     - score_threshold 0.10 (lower than MEC's 0.15) — CIT tolerates more
#       incompleteness; incident+behavior is useful without interpretation
#     - No branching_deficit strategy — CIT narratives are sequential chains,
#       not branching attribute trees
#     - close has heavy late-phase gating (-3.0 early/mid)
#
# Ontology is IDENTICAL to legacy — same nodes, edges, examples, descriptions.
# Only strategies and signals change.

method:
  name: critical_incident_v2
  version: "2.0"
  goal: "Explore specific memorable experiences to understand behavior through incident analysis"
  opening_bias: "Ask them to think of a recent time when this topic was especially memorable or significant."
  description: "Framework for understanding behavior through analysis of specific memorable experiences"

ontology:
  nodes:
    - name: incident
      level: 1
      terminal: false
      description: "Specific, memorable event or experience related to the product/category"
      examples:
        - "the time the barista made my coffee perfectly"
        - "when I tried oat milk for the first time"
        - "the day my coffee maker broke"

    - name: situation
      level: 2
      terminal: false
      description: "Contextual circumstances surrounding the incident"
      examples:
        - "rushing to catch a flight"
        - "hosting a dinner party"
        - "studying late for exams"

    - name: action
      level: 3
      terminal: false
      description: "What the person did during the incident"
      examples:
        - "asked for oat milk instead"
        - "went to a different cafe"
        - "made it myself at home"

    - name: outcome
      level: 4
      terminal: false
      description: "Result or consequence of the action taken"
      examples:
        - "coffee tasted amazing"
        - "avoided the usual stomach upset"
        - "felt proud of my choice"

    - name: emotion
      level: 5
      terminal: false
      description: "Emotional response during or after the incident"
      examples:
        - "surprised and delighted"
        - "relieved and grateful"
        - "frustrated and disappointed"

    - name: attribution
      level: 5
      terminal: false
      description: "What the person believes caused the outcome"
      examples:
        - "because of the creamy texture"
        - "due to the barista's skill"
        - "because oat milk is more sustainable"

    - name: learning
      level: 5
      terminal: false
      description: "Insight or takeaway from the incident"
      examples:
        - "oat milk froths better than I expected"
        - "I should always specify the brand"
        - "cafes vary in quality"

    - name: behavior_change
      level: 5
      terminal: true
      description: "How the incident influenced future behavior"
      examples:
        - "now I always ask for oat milk"
        - "started buying oat milk for home"
        - "recommend it to friends"

  edges:
    - name: occurred_in
      description: "Incident took place within a specific situation"
      chain_relevant: true

    - name: involved
      description: "Action taken during the incident"
      chain_relevant: true

    - name: resulted_in
      description: "Outcome produced by an action"
      chain_relevant: true

    - name: elicited
      description: "Emotional response triggered by outcome"
      chain_relevant: true

    - name: attributed_to
      description: "Perceived cause of an outcome"
      chain_relevant: false

    - name: led_to_learning
      description: "Insight gained from the incident"
      chain_relevant: true

    - name: influenced
      description: "Incident caused a change in future behavior"
      chain_relevant: true

    - name: similar_to
      description: "Incident shares characteristics with another incident"
      chain_relevant: false

    - name: contrasts_with
      description: "Incident differs meaningfully from another incident"
      chain_relevant: false

  extraction_guidelines:
    - "Ask for specific stories: 'Tell me about a time when...' or 'Recall a recent experience where...'"
    - "Focus on concrete incidents rather than general preferences"
    - "Extract the sequence: situation → action → outcome → emotion"
    - "Capture attributions - what the person believes caused the result"
    - "Identify learnings that changed their understanding"
    - "Note behavior changes that resulted from the incident"
    - "Look for patterns across multiple incidents"
    - "Distinguish between the factual event and the person's interpretation"

  extractability_criteria:
    extractable_contains:
      - "Specific stories or anecdotes ('the time when...', 'last week...')"
      - "Sequences of events or actions"
      - "Clear outcomes (positive or negative)"
      - "Emotional reactions to experiences"
      - "Explanations or causal attributions"
      - "Changes in behavior or decisions"
    non_extractable_contains:
      - "General opinions without specific examples"
      - "Hypothetical scenarios ('I would probably...')"
      - "Second-hand stories ('my friend said...')"
      - "Factual product descriptions without personal experience"

  concept_naming_convention: >
    Name each concept according to its role in the critical incident:
    incidents as specific memorable events or experiences,
    situations as contextual circumstances,
    actions as concrete behaviors taken,
    outcomes as results or consequences of actions,
    emotions as emotional responses or feelings,
    attributions as perceived causes or explanations,
    learnings as insights or takeaways,
    behavior_changes as subsequent changes in behavior.
    Use the examples in each node type description as naming models.

signals:
  graph:
    - convgraph.state.node.count
    - convgraph.state.max_depth
    - convgraph.state.node.orphan_count
    - convgraph.chain.completion
    # Canonical graph signals
    - canongraph.state.node.count
    - canongraph.state.edge.density
    - canongraph.state.exhaustion
    # Note: Node-level chain topology signals (convgraph.node.chain.gap.above, gap_below,
    # level_skip) are auto-discovered from strategy signal_weights and do not
    # need to be listed here.
    # f965 — per-concept-derived node signals:
    - convgraph.node.llm.elaboration
    - convgraph.node.llm.charge
    - convgraph.node.llm.has_quality_data

  llm:
    - response.semantic.llm.certainty
    - response.semantic.llm.engagement
    - response.semantic.llm.elaboration
    - response.semantic.llm.charge
    # Note: response.semantic.llm.engagement.trend is session-scoped and managed separately
    # Per-concept LLM signals (elaboration, charge) produce per-concept ratings that route to graph.node.* via Stage 6 bridge.

  temporal:
    - interview.strategy.self_count
    - interview.strategy.turns_since_change

  meta:
    - interview.phase
    - meta.saturation.conversation
    - meta.saturation.canonical

strategies:
  # Strategy 1: Elicit narrative (conversation-level, no node binding)
  # Opens new story arcs — "Tell me about a time when..."
  # Primary trigger: low specificity (vague narrative needs concreting).
  # Suppresses when canonical graph is saturated (enough material collected).
  - name: elicit_narrative
    node_binding: none
    bridge_direction: forward
    bridge_target: most_concrete
    extraction_mode: extract_new
    description: "Elicit a specific, concrete story — who, what, when, where. Prompt for vivid details and narrative context."
    signal_weights:
      # f965: specificity.low (0.9) → elaboration.low; specificity.mid (0.3) → elaboration.mid
      convgraph.node.llm.elaboration.low: 0.9
      convgraph.node.llm.elaboration.mid: 0.3
      # Certainty — uncertain respondent needs help anchoring in a memory
      response.semantic.llm.certainty.low: 0.6
      response.semantic.llm.certainty.mid: 0.3
      # f965: valence.high (0.3) → charge.positive; valence.low (0.2) → charge.negative
      convgraph.node.llm.charge.positive: 0.3
      # Phase 4.2: boosted from 0.2 to 0.3 (negative charge → emotional content to narrate)
      convgraph.node.llm.charge.negative: 0.3
      # Engagement — moderate engagement supports elicitation
      response.semantic.llm.engagement.mid: 0.4
      response.semantic.llm.engagement.high: 0.2
      # Novelty — prefer exploring fresh topics
      convgraph.node.novelty.high: 0.3
      # Saturation — suppress when enough material collected
      meta.saturation.canonical.high: -0.5
      meta.saturation.conversation.high: -0.4
      # Response quality — don't push for new stories when answers declining
      response.semantic.llm.engagement.trend.shallowing: -0.3
      response.semantic.llm.engagement.trend.fatigued: -0.5
      # Phase 4.2: softened from -0.5 to -0.3 (allow re-firing after 1-2 turns to maintain narrative flow)
      # Diversity — T2 + Critique: reduced from -0.7 to -0.5 to stay competitive with ascend
      # The high self-penalty was suppressing elicit_narrative after 1-2 firings while ascend ran unchecked
      interview.strategy.self_count: -0.3
      interview.strategy.self_count.high: 0
      # Node-level — prefer fresh, unconnected nodes
      convgraph.node.is_orphan.true: 0.6
      convgraph.node.focus.streak.none: 0.6
      convgraph.node.focus.streak.medium: -0.4
      convgraph.node.focus.streak.high: -0.7
      convgraph.node.exhaustion.low: 0.4

  # Strategy 2: Ascend — extend narrative toward emotional/interpretive layer
  # Move from concrete incident detail (who/what/when) toward meaning
  # (emotion, attribution, learning). Same mechanism as MEC ascend.
  - name: ascend
    node_binding: required
    valid_when: convgraph.node.chain.gap.above
    bridge_direction: forward
    bridge_target: most_abstract
    extraction_mode: extract_new
    description: "Move from concrete incident detail toward the emotional, attributional, or interpretive layer — ask what the incident meant or how it felt"
    signal_weights:
      convgraph.node.chain.gap.above.true: 0.25         # Structural gap above = room to ascend
      convgraph.node.recency: 0.2            # Prefer recently discussed nodes
      convgraph.node.exhaustion: -0.8        # T2 calibration: strengthened from -0.6 to enforce node rotation
      convgraph.node.focus.count.high: -0.5        # T2 calibration: strengthened from -0.4 for better rotation
      convgraph.node.focus.count.medium: -0.2
      # Engagement gates — ascending needs willing participation
      response.semantic.llm.engagement.low: -0.3
      # f965: intellectual_engagement.high (0.2) → 0.5× elaboration.high + 0.5× charge.positive
      convgraph.node.llm.elaboration.high: 0.1
      convgraph.node.llm.charge.positive: 0.1
      # Repetition brake — T2 + Critique: strengthened from -0.15 to -0.5 to prevent ascend monopoly
      interview.strategy.self_count: -0.5

  # Strategy 3: Ground — get more specific about the incident
  # Probe causal antecedents: who, what, when, what happened before.
  # Same mechanism as MEC ground.
  - name: ground
    node_binding: required
    valid_when: convgraph.node.chain.gap.below
    bridge_direction: backward
    bridge_target: most_concrete
    extraction_mode: extract_new
    description: "Get more specific about the incident — probe who, what, when, what led to it, what happened before"
    signal_weights:
      convgraph.node.chain.gap.below.true: 0.3           # Structural gap below = room to ground
      convgraph.node.recency: 0.25            # Prefer recently discussed nodes
      convgraph.node.exhaustion: -0.6         # T2 calibration: strengthened from -0.4 to enforce node rotation
      # f965: response_depth.shallow (0.05) → convgraph.node.llm.elaboration.low
      convgraph.node.llm.elaboration.low: 0.05
      # Mild repetition penalty
      interview.strategy.self_count: -0.15
      meta.saturation.conversation.high: -0.40
      meta.saturation.canonical.high: -0.30

  # Strategy 4: Bridge — fill gaps where respondent skips narrative levels
  # e.g., jumps from incident directly to learning without describing what happened.
  # Same mechanism as MEC bridge.
  - name: bridge
    node_binding: required
    valid_when: convgraph.node.chain.level.skip
    bridge_direction: forward
    bridge_target: most_abstract
    extraction_mode: extract_new
    description: "Fill a narrative gap where the respondent jumps levels — e.g., from incident to learning without describing what happened in between"
    signal_weights:
      convgraph.node.chain.level.skip.true: 0.35         # Level skip detected = bridge needed
      convgraph.node.recency: 0.2
      convgraph.node.exhaustion: -0.5         # T2 calibration: strengthened from -0.3
      # Mild repetition penalty
      interview.strategy.self_count: -0.15

  # Strategy 5: Anchor — connect isolated narrative elements to the story arc
  # Same mechanism as MEC anchor.
  - name: anchor
    node_binding: required
    valid_when: convgraph.node.is_orphan
    bridge_direction: forward
    bridge_target: either
    extraction_mode: prefer_existing
    description: "Connect an isolated narrative element to the main story arc — explore how it relates to known incidents, actions, or outcomes"
    signal_weights:
      convgraph.node.is_orphan.true: 0.50          # Orphan node = needs anchoring
      convgraph.node.recency: 0.2
      convgraph.node.exhaustion: -0.2
      # Mild repetition penalty
      interview.strategy.self_count: -0.15
      meta.saturation.conversation.high: -0.40
      meta.saturation.canonical.high: -0.30

  # Strategy 6: Revitalize — conversation-level fallback for fatigue
  # Shift to a new incident when current narrative is exhausted.
  # Same pattern as MEC strict revitalize.
  - name: revitalize
    node_binding: none
    description: "Shift to a fresh incident or new angle when the current narrative is exhausted or respondent shows fatigue"
    signal_weights:
      # Engagement domain — revitalize owns engagement signals exclusively
      response.semantic.llm.engagement.low: 0.50
      response.semantic.llm.engagement.trend.shallowing: 0.30
      response.semantic.llm.engagement.trend.fatigued: 0.80
      # Saturation — don't re-engage if conversation is saturated
      meta.saturation.conversation: -0.40
      meta.saturation.canonical: -0.40
      # Brake
      interview.strategy.self_count: -0.50

  # Strategy 7: Close — confirm the story and its meaning
  # Summarizes the full narrative arc (incident → outcome → learning).
  # Heavy late-phase gate prevents premature closing.
  - name: close
    node_binding: none
    generates_closing_question: true
    focus_mode: summary
    description: "Wrap up the interview by summarizing and confirming the key insights captured"
    signal_weights:
      interview.phase.late: 0.80       # Primary positive trigger (fires on last turn)
      interview.phase.early: -3.0      # Suppress in early phase
      interview.phase.mid: -3.0        # Suppress in mid phase
      interview.strategy.self_count: -0.50  # Light brake

chain_completion:
  expected_branching:
    incident: 3
    situation: 2
    action: 2
    outcome: 2
    emotion: 1
    attribution: 1
    learning: 1
    behavior_change: 1
  score_threshold: 0.10  # Lower than MEC's 0.15 — CIT tolerates more incompleteness;
                         # incident+behavior is already useful without interpretation

phases:
  early:
    description: "Elicit the incident — get the story, set the scene"
    signal_weights:
      elicit_narrative: 1.5
      ground: 1.4            # Ground early — establish concrete detail
      anchor: 1.2            # Anchor orphans to build story structure
      ascend: 1.0
      bridge: 0.8
      revitalize: 1.0
      close: 0.0          # Heavily gated by signal weight (-3.0)
    phase_bonuses:
      elicit_narrative: 0.2  # Ensure story elicitation fires even with zero base

  mid:
    description: "Deepen the narrative — emotions, causes, and consequences"
    signal_weights:
      ascend: 1.3            # Ascend from concrete to emotional/interpretive
      ground: 1.3
      bridge: 1.2
      elicit_narrative: 0.8  # Can still elicit contrasting incidents
      anchor: 1.0
      revitalize: 1.0
      close: 0.0          # Heavily gated by signal weight (-3.0)

  late:
    description: "Synthesize — close the narrative, confirm learnings"
    signal_weights:
      close: 1.5
      ascend: 1.2
      bridge: 1.2
      elicit_narrative: 0.7   # T2 + Critique: boosted from 0.5 to ensure narrative strategies can fire in late phase
      ground: 0.8
      anchor: 0.7
      revitalize: 1.0
    phase_bonuses:
      close: 0.3          # Ensure closing closes the interview
      elicit_narrative: 0.2  # T2 + Critique: ensure narrative elicitation stays competitive in late phase
      revitalize: 0.2
