# Means-End Chain Methodology Configuration (V2 Strict)
#
# V3 changes from legacy (removed deepen, clarify, explore, reflect):
#   - Retained 6 chain-aware strategies: ascend, ground, bridge, branch, anchor, revitalize
#   - Updated phase weights to remove legacy strategy references
#   - Raised score_threshold from 0.0 → 0.15 (production threshold)
#
# Prior V2 Strict changes from v1 (3.0):
#   - Added graph.node.novelty, graph.node.focus_count, graph.node.canonical_novelty
#     signals to all strategies — prevents interview getting stuck on turn-1 nodes
#   - Strengthened revitalize repetition penalty: -0.3 → -1.5
#   - permitted_connections KEPT on leads_to edge (strict schema enforcement)
#
# Tier 2 + Critique calibration (2026-04-15):
#   - ascend: reduced fan_in (0.067→0.033), recency (0.20→0.15), foundation (0.400→0.200)
#   - ascend: strengthened exhaustion (-0.6→-0.8), focus_count.high (-0.4→-0.8), repetition (-0.5→-1.5)
#   - ascend: added response_depth.deep (+0.3) to trigger laddering on deep content
#   - ground: reduced foundation.false (0.400→0.250)
#   - validate: added response_depth.deep (-0.3) to suppress premature closure on deep answers
#   - late phase: branch boost (1.1→1.3), validate bonus (0.2→0.3), branch bonus (+0.2)

method:
  name: means_end_chain_v2_strict
  version: "3.1"
  goal: "Explore causal chains from concrete attributes to abstract values"
  opening_bias: "Elicit concrete, experience-based responses. Ask for specific examples and situations."
  description: "Laddering: attributes → consequences → values"

ontology:
  nodes:
    - name: attribute
      level: 1
      terminal: false
      description: "A feature or property of the product/service itself — what it is, contains, or does by design, independent of any user outcome. If it can be described without mentioning a person, it's an attribute."
      non_attribute_examples:
        - "Any outcome the person experiences, does, or avoids as a result of using it — that's a functional_consequence, not an attribute"
        - "Any behavior the person performs ('I do X', 'I avoid Y') — the product enabling it is an attribute; the behavior itself is a functional_consequence"
        - "Any feeling or self-perception triggered by use — that's psychosocial_consequence, not an attribute"

    - name: functional_consequence
      level: 2
      terminal: false
      description: "A practical outcome of using the product — what the person experiences, can do, avoids, or achieves as a result. If it answers 'what happens when you use it?', it's functional."

    - name: psychosocial_consequence
      level: 3
      terminal: false
      description: "The emotional, identity, or social meaning of an outcome — how it affects self-image, confidence, relationships, or how others perceive the person. If it answers 'how does that make you feel, or how does it affect how others see you?', it's psychosocial."

    - name: instrumental_value
      level: 4
      terminal: false
      description: "A guiding principle or preferred way of behaving that the psychosocial outcome supports — a virtue or standard for how one should live. If it sounds like 'being X' or 'acting X', it's instrumental."

    - name: terminal_value
      level: 5
      terminal: true
      description: "A fundamental life goal or desired end-state that gives ultimate meaning to the instrumental value. If it feels like the final reason ('so I can ultimately have/be…'), it's terminal."

  edges:
    - name: leads_to
      description: "Causal or enabling relationship"
      permitted_connections:
        - [attribute, attribute]
        - [attribute, functional_consequence]
        - [functional_consequence, functional_consequence]
        - [functional_consequence, psychosocial_consequence]
        - [psychosocial_consequence, psychosocial_consequence]
        - [psychosocial_consequence, instrumental_value]
        - [instrumental_value, instrumental_value]
        - [instrumental_value, terminal_value]

    - name: revises
      description: "Contradiction - newer belief supersedes older one"
      permitted_connections:
        - ["*", "*"]

  extraction_guidelines:
    - "Extract BOTH explicit AND implicit relationships — MEC chains are often implied rather than stated"
    - "Explicit: Look for causal markers like 'because', 'so', 'that's why', 'leads to', 'which means'"
    - "Implicit: When multiple concepts co-occur in a response, connect them if they form a logical means-end chain"
    - "Contextual: If the interviewer asks 'why does X matter' and the response describes Y, create X→Y relationship"
    - "Chain direction: attribute → functional_consequence → psychosocial_consequence → instrumental_value → terminal_value"
    - "Target 2-3x more edges than nodes — prefer creating relationships over leaving concepts disconnected"
    - "CRITICAL — attribute vs functional_consequence boundary: Ask 'can this be described without mentioning a person?' If yes → attribute. If it describes what the person experiences, does, or avoids → functional_consequence"

  relationship_examples:
    explicit_causal:
      description: "Discourse markers explicitly state the connection"
      example: "I like froth because it makes coffee less bitter"
      extraction: "froth → makes coffee taste less bitter"

    implicit_same_response:
      description: "Multiple concepts in one response form logical consequence chain"
      example: "Froth makes coffee taste less bitter and gives a nice sensation in the mouth"
      extraction: "makes coffee taste less bitter → nice sensation in the mouth"

    implicit_conversational:
      description: "Question establishes antecedent, response provides consequence"
      example: "Interviewer: 'Why does the nice sensation matter?' Respondent: 'It feels like a good start of the day'"
      extraction: "nice sensation in the mouth → good start of the day"

    value_progression:
      description: "Parallel goals forming a chain toward terminal value"
      example: "I can be my best and set a good example to my kids"
      extraction: "be my best → set a good example to my kids"

  extractability_criteria:
    extractable_contains:
      - "Product attributes, features, or characteristics"
      - "Benefits, outcomes, or consequences"
      - "Feelings, emotions, or social implications"
      - "Values or life goals"
      - "Causal relationships between any of the above"
    non_extractable_contains:
      - "Simple yes/no responses"
      - "Acknowledgments ('okay', 'I see')"
      - "Questions back to the interviewer"
      - "Off-topic tangents"
      - "Very short responses with no substance"

  concept_naming_convention: >
    Name each concept according to its level in the means-end chain:
    attributes as product features or characteristics (describable without mentioning a person),
    functional consequences as practical outcomes the person experiences or achieves,
    psychosocial consequences as emotional or social meanings,
    instrumental values as principles or modes of being ('being X', 'acting X'),
    terminal values as fundamental life goals or end-states.

signals:
  graph:
    - graph.node_count
    - graph.max_depth
    - graph.orphan_count
    - graph.chain_completion
    # Canonical graph signals (Phase 4, experimental)
    - graph.canonical_concept_count
    - graph.canonical_edge_density
    - graph.canonical_exhaustion_score
    # Note: Node-level chain topology signals (graph.node.chain.*) are auto-discovered
    # from strategy signal_weights and do not need to be listed here.

  llm:
    - llm.response_depth
    - llm.valence
    - llm.certainty
    - llm.specificity
    - llm.engagement
    - llm.intellectual_engagement
    # Note: llm.global_response_trend is session-scoped and managed separately

  temporal:
    - temporal.strategy_repetition_count
    - temporal.turns_since_strategy_change

  meta:
    - meta.interview.phase
    - meta.conversation.saturation
    - meta.canonical.saturation
    # Note: meta.interview_progress is deprecated for MEC.
    # Replaced by meta.conversation.saturation and meta.canonical.saturation.

strategies:
  # Strategy 1: Revitalize engagement (elaboration)
  - name: revitalize
    node_binding: none
    description: "Shift to fresh topics when response trend shows fatigue or repeated shallow answers"
    signal_weights:
      # Fatigue detection triggers
      llm.global_response_trend.fatigued: 1.0
      llm.global_response_trend.shallowing: 0.8
      meta.node.opportunity.exhausted: 0.3
      # Engagement & valence triggers
      llm.engagement.low: 0.8
      llm.engagement.mid: 0.4
      llm.engagement.high: -0.4
      llm.intellectual_engagement.low: 0.2  # analytical disengagement = switch topics
      llm.valence.low: 0.5
      # N6: restored repetition escape valve (was removed N5) — phase-gated via multipliers to prevent early bursts
      temporal.strategy_repetition_count: 0.15
      # N6: boosted shallowing weight — fires 30% of turns and should help revitalize compete vs ascend
      # N1: Low specificity alone should not trigger revitalize — dampen it
      llm.specificity.low: -0.2
      # N2: Suppress revitalize floor in late phase — allow ascend's multiplier to re-assert
      meta.interview.phase.late: -0.5
      # Node-level signals
      graph.node.focus_streak.none: 0.8
      graph.node.focus_streak.medium: -0.4
      graph.node.focus_streak.high: -0.7
      graph.node.exhaustion_score.low: 0.5
      graph.node.novelty.high: 0.4
      graph.node.focus_count.high: -0.6
      graph.node.focus_count.medium: -0.3
      graph.node.focus_count.none: 0.3

  # Strategy 2: Ascend — extend incomplete chain upward toward terminal values
  - name: ascend
    description: "Extend an incomplete chain upward by asking what the current concept leads to at the next ontology level"
    node_binding: required
    valid_when: graph.node.gap_above
    signal_weights:
      graph.node.gap_above.true: 0.25  # R3: reduced from 0.3 (0.2 was too aggressive, ground dominated)
      graph.node.fan_in: 0.033
      graph.node.recency_score: 0.15
      graph.node.exhaustion_score: -0.8  # N7: strengthened from -0.4 — prevents circular revisits
      graph.node.focus_count.high: -0.8  # N7: hard brake on over-probed nodes
      graph.node.focus_count.medium: -0.4
      llm.response_depth.deep: 0.1
      llm.engagement.low: -0.3       # R3: soft brake when respondent is fading
      llm.intellectual_engagement.high: 0.2  # analytical reasoning = productive laddering target
      llm.response_depth.deep: 0.3  # Tier 2 + Critique: trigger laddering on deep content
      temporal.strategy_repetition_count: -1.5  # Tier 2 + Critique: strengthened from -0.5
      temporal.strategy_repetition_count.high: -1.0  # T2 calibration: high streak penalty
      graph.node.chain.has_attribute_foundation.true: 0.200   # Tier 2 + Critique: reduced from 0.400
      graph.node.chain.has_attribute_foundation.false: -0.5  # floating chain, suppress ascend

  # Strategy 3: Ground — establish causal antecedents for ungrounded high-level node
  - name: ground
    description: "Ground an ungrounded node by asking what attributes or lower-level concepts directly cause or enable it — probe causal antecedents, not retrospective comparisons or general context"
    node_binding: required
    valid_when: graph.node.gap_below
    signal_weights:
      graph.node.gap_below.true: 0.3
      graph.node.recency_score: 0.25
      graph.node.exhaustion_score: -0.4
      llm.response_depth.deep: 0.05
      temporal.strategy_repetition_count: -0.15  # R2: mild repetition penalty on structural strategies
      graph.node.chain.has_attribute_foundation.false: 0.250  # Tier 2 + Critique: reduced from 0.400
      graph.node.chain.has_attribute_foundation.true: -0.2   # already grounded, reduce priority

  # Strategy 4: Bridge — fill missing intermediate level in a skipped chain
  - name: bridge
    description: "Fill a structural gap by asking what happens between a lower and higher concept that are directly connected but skip ontology levels"
    node_binding: required
    valid_when: graph.node.level_skip
    signal_weights:
      graph.node.level_skip.true: 0.35
      graph.node.recency_score: 0.2
      graph.node.exhaustion_score: -0.3
      temporal.strategy_repetition_count: -0.15  # R2: mild repetition penalty on structural strategies

  # Strategy 5: Branch — expand breadth at attribute level
  - name: branch
    description: "Elicit additional product attributes or features at the same level — ask what other concrete characteristics of the product the respondent experiences or values"
    node_binding: required
    valid_when: graph.node.branching_deficit
    signal_weights:
      graph.node.branching_deficit: 0.25
      graph.node.recency_score: 0.15
      graph.node.exhaustion_score: -0.3
      llm.engagement.high: 0.1
      temporal.strategy_repetition_count: -0.15  # R2: mild repetition penalty on structural strategies
      graph.node.chain.has_attribute_foundation.true: 0.3   # only branch when grounded
      graph.node.chain.has_terminal_apex.true: 0.5          # N7: boosted from 0.4 — fires once chain is complete

  # Strategy 6: Anchor — connect isolated node to existing graph structure
  - name: anchor
    description: "Connect an isolated concept to the existing graph by exploring how it relates to other known concepts"
    node_binding: required
    valid_when: graph.node.is_orphan
    signal_weights:
      graph.node.is_orphan.true: 0.50  # N7: strengthened from 0.35 — orphan growth 12.8% above 10% threshold
      graph.node.recency_score: 0.2
      graph.node.exhaustion_score: -0.2
      temporal.strategy_repetition_count: -0.15  # R2: mild repetition penalty on structural strategies

  # Strategy 7: Validate — late-phase closing strategy
  # T2 calibration: added to MEC strict to ensure proper interview termination
  - name: validate
    node_binding: none
    generates_closing_question: true
    focus_mode: summary
    description: "Confirm understanding and check if the most important aspects of the respondent's chains and values have been captured"
    signal_weights:
      # Late-stage gate: prevent premature interview termination
      meta.interview.phase.early: -3.0
      meta.interview.phase.mid: -3.0
      # Saturation triggers — T2 calibration: boosted from 0.3/0.
      llm.certainty.low: 1.0
      llm.certainty.mid: 0.7
      # Engagement — low engagement suggests wrapping up
      llm.engagement.low: 0.6
      # Response depth — deep responses = enough material to validate
      llm.response_depth.deep: 0.3
      llm.response_depth.moderate: 0.2
      # Node-level — prefer well-connected nodes for validation
      graph.node.has_outgoing.true: 0.4
      graph.node.focus_streak.high: 0.5
      graph.node.novelty.high: 0.1
      graph.node.focus_count.high: -0.4
      graph.node.focus_count.medium: -0.2
      graph.node.canonical_novelty.confirming: 0.2
      # Node extraction opportunity
      meta.node.opportunity.probe_deeper: 0.6
      # Strategy repetition — lighter penalty; OK to re-validate
      temporal.strategy_repetition_count: -0.7

chain_completion:
  expected_branching:
    attribute: 3
    functional_consequence: 2
    psychosocial_consequence: 1
    instrumental_value: 1
    terminal_value: 1
  score_threshold: 0.15  # Production threshold — below this, conversation-level strategies may activate

phases:
  early:
    # R1: Max multiplier gap narrowed from 0.7 to 0.4 — branch still preferred but ascend can compete
    # N6: ground boosted to 1.4 (was 1.1) to actively establish attribute foundation before ascending
    description: "Initial exploration, building graph structure"
    signal_weights:
      branch: 1.4
      ascend: 1.0
      ground: 1.4
      bridge: 0.8
      anchor: 1.2
      revitalize: 1.0
      validate: 0.2           # Strongly suppressed — too early to wrap up
    phase_bonuses:
      branch: 0.1

  mid:
    # R1: Max multiplier gap narrowed — ascend still preferred but branch/bridge remain competitive
    # N6: ascend reduced 1.4→1.3, ground increased 1.2→1.3 — equalized to let node signals decide
    # N6: removed ascend phase_bonus 0.15 — was pushing ascend past all competition structurally
    description: "Building depth and connections"
    signal_weights:
      ascend: 1.3
      ground: 1.3
      bridge: 1.2
      branch: 1.0
      anchor: 1.0
      revitalize: 1.0
      validate: 0.5           # Becoming available but still suppressed

  late:
    # R1: Ascend still dominates but gap reduced — bridge and revitalize can fire
    # N4: phase_bonuses added to keep structural strategy base scores positive
    # N7: branch boosted to 1.1 (was 0.8) — fires once chain complete (T+T state)
    # T2 calibration: validate added as primary late-phase strategy
    description: "Validation and verification"
    signal_weights:
      validate: 1.5           # Primary late-phase strategy
      ascend: 1.2
      ground: 0.9
      bridge: 1.3
      branch: 1.1
      anchor: 0.7
      revitalize: 1.2
    phase_bonuses:
      validate: 0.2           # Ensure validation gets selected
      revitalize: 0.2
      ascend: 0.10
      bridge: 0.05
      branch: 0.30            # T2 calibration: late-phase bonus for breadth expansion
