# Means-End Chain Methodology Configuration (V3 Flex)
#
# V3 Flex changes from V2 Strict (3.1):
#   - permitted_connections REMOVED from leads_to edge
#     The edge type and its semantic description remain — the LLM uses them to
#     create connections. Without the whitelist, the LLM can connect any node
#     types it judges to be causally related (e.g., attribute → instrumental_value
#     when the chain is compressed in the respondent's language).
#   - All signal weights are identical to means_end_chain_v2_strict
#
# Use this variant when:
#   - Respondents skip levels in their reasoning (e.g., jump from attribute to value)
#   - You expect non-linear MEC chains (e.g., terminal_value → attribute for contrast)
#   - You want richer graph structure at the cost of looser schema enforcement

method:
  name: means_end_chain_v3_flex
  version: "3.2"
  goal: "Explore causal chains from concrete attributes to abstract values"
  opening_bias: "Elicit concrete, experience-based responses. Ask for specific examples and situations."
  description: "Laddering: attributes → consequences → values (flex: LLM-determined connections)"

ontology:
  nodes:
    - name: attribute
      level: 1
      terminal: false
      description: "Concrete product feature or characteristic"
      examples:
        - "creamy texture"
        - "plant-based"
        - "sustainable packaging"

    - name: functional_consequence
      level: 2
      terminal: false
      description: "Tangible outcome from using the product"
      examples:
        - "easier to digest"
        - "mixes well with coffee"

    - name: psychosocial_consequence
      level: 3
      terminal: false
      description: "Emotional or social outcome"
      examples:
        - "feel healthier"
        - "gain respect from peers"

    - name: instrumental_value
      level: 4
      terminal: false
      description: "Preferred mode of behavior"
      examples:
        - "being responsible"
        - "taking care of myself"

    - name: terminal_value
      level: 5
      terminal: true
      description: "End-state of existence, core life goal"
      examples:
        - "self-respect"
        - "sense of accomplishment"
        - "family security"

  edges:
    - name: leads_to
      description: "Causal or enabling relationship — connects any two nodes where one drives, enables, or results in the other. The LLM determines which node pairs can connect based on the respondent's expressed reasoning."

    - name: revises
      description: "Contradiction - newer belief supersedes older one"
      permitted_connections:
        - ["*", "*"]

  extraction_guidelines:
    - "For Means-End Chain interviews, extract BOTH explicit AND implicit relationships"
    - "Explicit: Look for causal markers like 'because', 'so', 'that's why', 'leads to'"
    - "Implicit (MEC chains): When multiple concepts are mentioned in the same response, connect them if they form a logical means-end chain"
    - "Contextual: If the interviewer asks 'why does X matter' and the response describes Y, create X→Y relationship"
    - "For Means-End Chain interviews, create edges between concepts that represent the chain of reasoning, even when no explicit connector is used"
    - "attribute → functional_consequence (features → outcomes)"
    - "functional_consequence → psychosocial_consequence (outcomes → feelings)"
    - "psychosocial_consequence → instrumental_value (feelings → goals)"
    - "instrumental_value → terminal_value (goals → life values)"
    - "In flex mode: respondents often compress levels. If they jump directly from attribute to value, create that edge rather than forcing intermediate nodes."
    - "Target 2-3x more edges than nodes for a well-structured MEC graph"
    - "Prefer creating relationships over leaving concepts disconnected"

  relationship_examples:
    explicit_causal:
      description: "Discourse markers explicitly state the connection"
      example: "I like froth because it makes coffee less bitter"
      extraction: "froth → makes coffee taste less bitter"

    implicit_same_response:
      description: "Multiple concepts in one response form logical consequence chain"
      example: "Froth makes coffee taste less bitter and gives a nice sensation in the mouth"
      extraction: "makes coffee taste less bitter → nice sensation in the mouth"

    implicit_conversational:
      description: "Question establishes antecedent, response provides consequence"
      example: "Interviewer: 'Why does the nice sensation matter?' Respondent: 'It feels like a good start of the day'"
      extraction: "nice sensation in the mouth → good start of the day"

    value_progression:
      description: "Parallel goals forming a chain toward terminal value"
      example: "I can be my best and set a good example to my kids"
      extraction: "be my best → set a good example to my kids"

    compressed_chain:
      description: "Respondent skips intermediate levels — flex allows direct connection"
      example: "I eat high-protein foods because it's about who I want to be"
      extraction: "attribute('high-protein foods') → leads_to → terminal_value('be my best self')"

  extractability_criteria:
    extractable_contains:
      - "Product attributes, features, or characteristics"
      - "Benefits, outcomes, or consequences"
      - "Feelings, emotions, or social implications"
      - "Values or life goals"
      - "Causal relationships between any of the above"
    non_extractable_contains:
      - "Simple yes/no responses"
      - "Acknowledgments ('okay', 'I see')"
      - "Questions back to the interviewer"
      - "Off-topic tangents"
      - "Very short responses with no substance"

  concept_naming_convention: >
    Name each concept according to its level in the means-end chain:
    attributes as concrete product features or characteristics,
    consequences as functional or psychosocial outcomes,
    values as abstract personal values or life goals.
    Use the examples in each node type description as naming models.

signals:
  graph:
    - graph.node_count
    - graph.max_depth
    - graph.orphan_count
    - graph.chain_completion
    # Canonical graph signals (Phase 4, experimental)
    - graph.canonical_concept_count
    - graph.canonical_edge_density
    - graph.canonical_exhaustion_score

  llm:
    - llm.response_depth
    - llm.valence
    - llm.certainty
    - llm.specificity
    - llm.engagement
    # Note: llm.global_response_trend is session-scoped and managed separately

  temporal:
    - temporal.strategy_repetition_count
    - temporal.turns_since_strategy_change

  meta:
    - meta.interview.phase
    - meta.conversation.saturation
    - meta.canonical.saturation

strategies:
  # Strategy 1: Deepen the chain (laddering)
  - name: deepen
    description: "Explore why something matters to understand deeper motivations and values through progressive 'why' questioning"
    signal_weights:
      llm.response_depth.surface: 0.8
      llm.response_depth.shallow: 0.3
      llm.response_depth.moderate: 0.15
      graph.max_depth: -0.3
      graph.chain_completion.has_complete.false: 0.6
      llm.engagement.high: 0.5
      llm.engagement.mid: 0.3
      llm.engagement.low: -0.5
      llm.valence.high: 0.4
      llm.global_response_trend.shallowing: 0.4
      temporal.strategy_repetition_count: -0.8
      graph.node.exhaustion_score.low: 0.3
      graph.node.focus_streak.low: 0.5
      graph.node.focus_streak.medium: -0.4
      graph.node.focus_streak.high: -0.8
      graph.node.novelty.high: 0.3
      graph.node.novelty.medium: 0.15
      graph.node.focus_count.high: -0.6
      graph.node.focus_count.medium: -0.3
      graph.node.focus_count.none: 0.3
      graph.node.canonical_novelty.confirming: 0.2
      meta.canonical.saturation.high: -0.5
      meta.conversation.saturation.high: -0.4

  # Strategy 2: Clarify relationships (probing)
  - name: clarify
    description: "Rephrase the question in simpler, clearer words when user shows confusion or lack of understanding"
    signal_weights:
      llm.specificity.low: 0.8
      llm.certainty.low: 0.5
      llm.engagement.mid: 0.3
      meta.canonical.saturation.high: -0.5
      meta.conversation.saturation.high: -0.4
      temporal.strategy_repetition_count: -0.3
      temporal.turns_since_strategy_change: -0.3
      graph.node.is_orphan.true: 0.7
      graph.node.exhaustion_score.low: 0.4
      graph.node.focus_streak.none: 0.3
      graph.node.novelty.high: 0.4
      graph.node.novelty.medium: 0.2
      graph.node.focus_count.high: -0.5
      graph.node.focus_count.medium: -0.2
      graph.node.focus_count.none: 0.3
      graph.node.canonical_novelty.new: 0.4
      graph.node.canonical_novelty.orphan: 0.3

  # Strategy 3: Explore new areas (elaboration)
  - name: explore
    description: "Find new branches and related concepts by asking 'what else?' to expand breadth"
    signal_weights:
      llm.certainty.low: 0.4
      temporal.strategy_repetition_count: -0.8
      llm.engagement.mid: 0.4
      llm.valence.low: 0.3
      meta.canonical.saturation.high: -0.5
      meta.conversation.saturation.high: -0.4
      llm.global_response_trend.shallowing: -0.4
      llm.global_response_trend.fatigued: -0.6
      graph.node.focus_streak.none: 0.6
      graph.node.focus_streak.medium: -0.4
      graph.node.focus_streak.high: -0.7
      graph.node.yield_stagnation.false: 0.5
      graph.node.exhaustion_score.low: 0.4
      graph.node.novelty.high: 0.6
      graph.node.novelty.medium: 0.3
      graph.node.focus_count.high: -0.6
      graph.node.focus_count.medium: -0.3
      graph.node.focus_count.none: 0.3
      graph.node.canonical_novelty.new: 0.5
      graph.node.canonical_novelty.orphan: 0.3

  # Strategy 4: Reflect and validate (validation)
  - name: reflect
    node_binding: none
    description: "Summarize what you've heard and invite correction or addition to validate understanding"
    signal_weights:
      graph.max_depth: 0.7
      llm.response_depth.deep: 0.6
      llm.certainty.low: 0.7
      llm.certainty.mid: 0.7
      meta.node.opportunity.probe_deeper: 0.6
      llm.engagement.low: 0.6
      # Phase gates — reflect is high-base; must not win in early/mid phase
      meta.interview.phase.early: -3.0
      meta.interview.phase.mid: -1.0
      # Diversity
      temporal.strategy_repetition_count: -1.5
      temporal.strategy_repetition_count.high: -1.0
      graph.node.has_outgoing.true: 0.8
      graph.node.focus_streak.high: 0.5
      technique.node.strategy_repetition.low: 0.3
      graph.node.novelty.high: 0.1
      graph.node.focus_count.high: -0.4
      graph.node.focus_count.medium: -0.2
      graph.node.canonical_novelty.confirming: 0.2
      meta.conversation.saturation: 0.3
      meta.canonical.saturation: 0.2

  # Strategy 5: Revitalize engagement (elaboration)
  - name: revitalize
    node_binding: none
    description: "Shift to fresh topics when response trend shows fatigue or repeated shallow answers"
    signal_weights:
      llm.global_response_trend.fatigued: 1.0
      llm.global_response_trend.shallowing: 0.5
      meta.node.opportunity.exhausted: 0.3
      llm.engagement.low: 0.8
      llm.engagement.mid: 0.4
      llm.engagement.high: -0.4
      llm.valence.low: 0.5
      temporal.strategy_repetition_count: -1.5
      temporal.strategy_repetition_count.high: -1.0
      graph.node.focus_streak.none: 0.8
      graph.node.focus_streak.medium: -0.4
      graph.node.focus_streak.high: -0.7
      graph.node.exhaustion_score.low: 0.5
      graph.node.novelty.high: 0.4
      graph.node.focus_count.high: -0.6
      graph.node.focus_count.medium: -0.3
      graph.node.focus_count.none: 0.3

  # Strategy 6: Ascend — extend incomplete chain upward toward terminal values
  - name: ascend
    description: "Extend an incomplete chain upward by asking what the current concept leads to at the next ontology level"
    node_binding: required
    valid_when: graph.node.gap_above
    signal_weights:
      graph.node.gap_above.true: 0.3
      graph.node.fan_in: 0.067
      graph.node.recency_score: 0.2
      graph.node.exhaustion_score: -0.4
      llm.response_depth.deep: 0.1

  # Strategy 7: Ground — establish causal antecedents for ungrounded high-level node
  - name: ground
    description: "Ground an ungrounded node by asking what attributes or lower-level concepts lead to it"
    node_binding: required
    valid_when: graph.node.gap_below
    signal_weights:
      graph.node.gap_below.true: 0.3
      graph.node.recency_score: 0.25
      graph.node.exhaustion_score: -0.4
      llm.response_depth.deep: 0.05

  # Strategy 8: Bridge — fill missing intermediate level in a skipped chain
  - name: bridge
    description: "Fill a structural gap by asking what happens between a lower and higher concept that are directly connected but skip ontology levels"
    node_binding: required
    valid_when: graph.node.level_skip
    signal_weights:
      graph.node.level_skip.true: 0.35
      graph.node.recency_score: 0.2
      graph.node.exhaustion_score: -0.3

  # Strategy 9: Branch — expand breadth at a level where methodology expects more siblings
  - name: branch
    description: "Expand breadth by asking whether there are other concepts at the same level that also connect to the same parent or child"
    node_binding: required
    valid_when: graph.node.branching_deficit
    signal_weights:
      graph.node.branching_deficit: 0.25
      graph.node.recency_score: 0.15
      graph.node.exhaustion_score: -0.3
      llm.engagement.high: 0.1

  # Strategy 10: Anchor — connect isolated node to existing graph structure
  - name: anchor
    description: "Connect an isolated concept to the existing graph by exploring how it relates to other known concepts"
    node_binding: required
    valid_when: graph.node.is_orphan
    signal_weights:
      graph.node.is_orphan.true: 0.35
      graph.node.recency_score: 0.2
      graph.node.exhaustion_score: -0.2

chain_completion:
  expected_branching:
    attribute: 3
    functional_consequence: 2
    psychosocial_consequence: 1
    instrumental_value: 1
    terminal_value: 1
  score_threshold: 0.0  # Phase 2: set low so fallback doesn't interfere with comparison

phases:
  early:
    description: "Initial exploration, building graph structure"
    signal_weights:
      explore: 1.5
      clarify: 1.2
      deepen: 0.5
      reflect: 0.2
      branch: 1.5
      ascend: 0.8
      ground: 1.0
      bridge: 0.5
      anchor: 1.2
    phase_bonuses:
      explore: 0.2

  mid:
    description: "Building depth and connections"
    signal_weights:
      deepen: 1.3
      clarify: 0.8
      revitalize: 1.0
      explore: 0.6
      reflect: 0.7
      ascend: 1.5
      ground: 1.2
      bridge: 1.3
      branch: 0.8
      anchor: 1.0
    phase_bonuses:
      deepen: 0.3

  late:
    description: "Validation and verification"
    signal_weights:
      reflect: 1.2
      revitalize: 1.2
      deepen: 0.5
      explore: 0.3
      ascend: 1.8
      ground: 0.8
      bridge: 1.5
      branch: 0.5
      anchor: 0.6
    phase_bonuses:
      reflect: 0.2
      revitalize: 0.2
