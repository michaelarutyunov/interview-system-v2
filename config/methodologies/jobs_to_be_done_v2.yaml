# Jobs-to-be-Done Methodology Configuration (V3 — 5-level chain-aware architecture)
#
# V3 changes from V2:
#   - Ontology restructured from 2 levels to 5 levels reflecting the JTBD causal chain:
#     L0: Context/Trigger → L1: Pain/Gain → L2: Job Statement → L3: Emotional/Social → L4: Solution
#   - Terminal node changed from emotional_job/social_job to solution_approach
#     (in JTBD theory, the solution is what you HIRE — the endpoint of the chain)
#   - Edge types renamed for semantic precision:
#     enables → implies (pain/gain reveals the job)
#     enables → drives (motivation/job shapes solution selection)
#     addresses split into addresses (solution→pain) and achieves (solution→gain)
#   - chain_relevant flags: only the upward spine edges are chain-relevant
#     (triggers, implies, supports, drives). addresses/achieves are downward
#     cross-level edges used by extraction but not by chain topology.
#
# Chain topology implications (5 levels vs 2):
#   - gap.above: meaningful — can detect chains stalled at L0, L1, L2, or L3
#   - gap.below: meaningful — can detect chains missing antecedents at any level
#   - level.skip: now possible (e.g., trigger → job_statement skips L1)
#   - has_attribute_foundation: checks if chain traces back to L0 (context/trigger)
#   - has_terminal_apex: checks if chain reaches L4 (solution_approach)
#   - ascend/ground strategies now have precise targets at each chain level
#
# valid_when gates removed (V3.1):
#   Node-bound strategies (ascend, ground, probe_pain, anchor) do NOT use
#   valid_when gates. Canonical slot nodes lack chain topology signals, so
#   hard-gating would permanently dead-lock these strategies. Signal weights
#   (e.g., gap.above.true: 0.25, is_orphan.true: 0.50) provide soft guidance
#   instead — strategies score higher for structurally appropriate nodes but
#   are never hard-excluded.
#
# Strategy mapping (unchanged from V2):
#   explore_situation    → elaborate   (breadth exploration, no gate)
#   probe_alternatives   → probe_pain  (targets pain points via is_orphan proxy)
#   dig_motivation       → ascend      (ladder upward through chain levels)
#   uncover_obstacles    → ground      (find lower-level antecedents)
#   clarify_assumption   → anchor      (connect isolated concepts)
#   revitalize           → revitalize  (fatigue-fallback pattern)
#   validate_outcome     → validate    (late-phase closing strategy)

method:
  name: jobs_to_be_done_v2
  version: "3.0"
  goal: "Understand what jobs users are trying to accomplish and what motivates them"
  opening_bias: "Ask about a specific recent time they made a decision or change related to the topic."
  description: "Framework for understanding customer motivation and needs through job statements"

phase_boundaries:
  early_max_turns: 3
  mid_max_turns: 8

ontology:
  nodes:
    - name: job_context
      level: 0
      terminal: false
      description: "Situation or circumstances when the job arises"
      examples:
        - "when I'm rushing to work"
        - "when I'm working from home"
        - "when meeting clients"

    - name: job_trigger
      level: 0
      terminal: false
      description: "Event or stimulus that initiates the job"
      examples:
        - "feeling tired in the morning"
        - "anticipating a long meeting"
        - "hosting a gathering"

    - name: pain_point
      level: 1
      terminal: false
      description: "Obstacle or frustration in getting the job done"
      examples:
        - "coffee is too bitter"
        - "takes too long to prepare"
        - "upsets my stomach"

    - name: gain_point
      level: 1
      terminal: false
      description: "Desired outcome or benefit that makes the job worthwhile"
      examples:
        - "smooth, enjoyable taste"
        - "quick and convenient"
        - "feeling energized without jitters"

    - name: job_statement
      level: 2
      terminal: false
      description: "Core functional job a customer is trying to accomplish"
      examples:
        - "get my daily caffeine fix"
        - "feel productive in the morning"
        - "socialize with colleagues"

    - name: emotional_job
      level: 3
      terminal: false
      description: "Emotional state or identity the customer seeks to achieve"
      examples:
        - "feel healthy and conscientious"
        - "project a professional image"
        - "treat myself with care"

    - name: social_job
      level: 3
      terminal: false
      description: "Social impression or relationship the customer wants to influence"
      examples:
        - "fit in with health-conscious peers"
        - "signal environmental values"
        - "avoid social awkwardness"

    - name: solution_approach
      level: 4
      terminal: true
      description: "What the customer currently hires to make progress — current or potential solution"
      examples:
        - "using oat milk in coffee"
        - "buying coffee at a cafe"
        - "meal prepping"

  edges:
    # ── Chain-relevant (upward spine) ──
    - name: triggers
      description: "Causal: source initiates or causes target (situation gives rise to need)"
      chain_relevant: true

    - name: implies
      description: "Need reveals or defines the job (pain/gain implies what the functional job is)"
      chain_relevant: true

    - name: supports
      description: "Job co-occurs with or reinforces emotional/social motivation (non-causal)"
      chain_relevant: true

    - name: drives
      description: "Motivation or job shapes solution selection (biases tradeoffs, motivates hiring)"
      chain_relevant: true

    # ── Non-chain-relevant ──
    - name: occurs_in
      description: "Trigger occurs within a specific context (situational containment)"
      chain_relevant: false

    - name: addresses
      description: "Solution resolves a pain point (downward edge, not chain progression)"
      chain_relevant: false

    - name: achieves
      description: "Solution delivers a gain point (downward edge, not chain progression)"
      chain_relevant: false

    - name: conflicts_with
      description: "Something that prevents or undermines something else"
      chain_relevant: false

    - name: revises
      description: "Contradiction - newer belief or approach supersedes older one"
      chain_relevant: false

  extraction_guidelines:
    - "Listen for phrases indicating what the user is trying to accomplish ('I need to...', 'I want to...', 'The goal is...')"
    - "Identify the circumstances when the job becomes important ('when...', 'especially when...', 'in situations like...')"
    - "Extract pain points directly expressed ('frustrating that...', 'hate it when...', 'problem is...')"
    - "Extract gain points as positive outcomes ('love that...', 'great because...', 'important that...')"
    - "Distinguish between functional, emotional, and social jobs - often all three coexist"
    - "Map the current solution approach even if not explicitly stated"
    - "Connect jobs to their underlying emotional and social drivers"
    - "Look for trade-offs users make between competing jobs"
    - "Actively extract emotional jobs: look for identity statements, feeling words, aspirational language"
    - "Actively extract social jobs: look for peer references, social signals, reputation concerns"

  relationship_examples:
    trigger_to_need:
      description: "Context or trigger gives rise to a need"
      example: "When the afternoon slump hits at work, I feel sluggish and unfocused"
      extraction: "job_trigger('afternoon slump at work') → triggers → pain_point('feeling sluggish and unfocused')"

    need_implies_job:
      description: "Pain or gain reveals what the functional job is"
      example: "I hate the chemical aftertaste of diet drinks, so I want something clean-tasting"
      extraction: "pain_point('chemical aftertaste') → implies → job_statement('find a clean-tasting refreshment')"

    job_supports_emotional:
      description: "Functional job co-occurs with emotional motivation"
      example: "Staying hydrated makes me feel like I'm taking care of myself"
      extraction: "job_statement('stay hydrated') → supports → emotional_job('feel like I take care of myself')"

    motivation_drives_solution:
      description: "Emotional or functional need shapes what solution is hired"
      example: "I pick ZeroFizz because it lets me have a soda without the guilt"
      extraction: "emotional_job('avoid guilt about drinking soda') → drives → solution_approach('choosing ZeroFizz')"

    solution_addresses_pain:
      description: "Solution resolves a specific frustration"
      example: "ZeroFizz doesn't have that artificial taste that Diet Coke has"
      extraction: "solution_approach('ZeroFizz') → addresses → pain_point('artificial chemical taste')"

    solution_achieves_gain:
      description: "Solution delivers a desired outcome"
      example: "ZeroFizz gives me a refreshing break without the caffeine crash"
      extraction: "solution_approach('ZeroFizz') → achieves → gain_point('refreshing without caffeine crash')"

  extractability_criteria:
    extractable_contains:
      - "Goals or objectives the user wants to achieve"
      - "Frustrations, pain points, or obstacles"
      - "Positive outcomes or benefits they value"
      - "Situational context (when, where, with whom)"
      - "Current solutions or workarounds"
      - "Emotions or social considerations related to choices"
    non_extractable_contains:
      - "Simple yes/no responses"
      - "Acknowledgments ('okay', 'I see', 'right')"
      - "Questions back to the interviewer"
      - "Purely factual product descriptions without user context"
      - "Irrelevant tangents"

  concept_naming_convention: >
    Name each concept according to its node type role:
    phrase job_statements as jobs to be done,
    pain_points as frustrations or obstacles,
    gain_points as desired outcomes or benefits,
    solution_approaches as methods or actions,
    job_contexts as situations or circumstances,
    emotional_jobs as emotional states sought,
    social_jobs as social outcomes desired,
    job_triggers as initiating events.
    Use the examples in each node type description as naming models.

signals:
  graph:
    - convgraph.state.node.count
    - convgraph.state.max_depth
    - convgraph.state.node.orphan_count
    - convgraph.chain.completion
    # Canonical graph signals (experimental)
    - canongraph.state.node.count
    - canongraph.state.edge.density
    - canongraph.state.exhaustion
    # Note: Node-level chain topology signals (convgraph.node.chain.gap.above, gap_below,
    # is_orphan, etc.) are auto-discovered from strategy signal_weights and
    # do not need to be listed here.
    # f965 — per-concept-derived node signals:
    - convgraph.node.llm.elaboration
    - convgraph.node.llm.charge
    - convgraph.node.llm.has_quality_data

  llm:
    - response.semantic.llm.certainty
    - response.semantic.llm.engagement
    - response.semantic.llm.elaboration
    - response.semantic.llm.charge
    # Note: response.semantic.llm.engagement.trend is session-scoped and managed separately
    # Per-concept LLM signals (elaboration, charge) produce per-concept ratings that route to graph.node.* via Stage 6 bridge.

  temporal:
    - interview.strategy.self_count
    - interview.strategy.turns_since_change

  meta:
    - interview.phase
    - meta.saturation.conversation
    - meta.saturation.canonical
    # Note: meta.interview_progress is intentionally excluded from JTBD.
    # Replaced by meta.saturation.conversation and meta.saturation.canonical
    # which are information-velocity-based rather than structural.

strategies:
  # Strategy 1: Elaborate — breadth exploration, conversation-level
  # Replaces legacy explore_situation. No valid_when gate, no node binding.
  # Fires when engagement is moderate and topics are fresh — keeps interview
  # exploring new ground rather than drilling into one chain.
  - name: elaborate
    node_binding: none
    description: "Explore new aspects of the respondent's experience — situations, contexts, and jobs that haven't been discussed yet"
    signal_weights:
      # Fatigue detection — suppress exploration during declining quality
      response.semantic.llm.engagement.trend.fatigued: -0.6
      response.semantic.llm.engagement.trend.shallowing: -0.4
      # Engagement — moderate engagement = breadth is productive
      response.semantic.llm.engagement.mid: 0.4
      response.semantic.llm.engagement.low: -0.3              # Disengaged respondent = don't explore
      # Novelty — favor fresh, unexplored territory
      convgraph.node.novelty.high: 0.6          # Recently-created nodes = rich territory
      convgraph.node.novelty.medium: 0.3
      convgraph.node.focus.streak.none: 0.6     # Nodes never focused on = prime targets
      convgraph.node.focus.streak.medium: -0.4
      convgraph.node.focus.streak.high: -0.7
      convgraph.node.focus.count.none: 0.3
      convgraph.node.focus.count.medium: -0.3
      convgraph.node.focus.count.high: -0.6
      canongraph.node.novelty.new: 0.5
      canongraph.node.novelty.orphan: 0.3
      convgraph.node.yield_stagnation.false: 0.5  # Nodes still yielding = productive
      convgraph.node.exhaustion.low: 0.4    # Avoid exhausted nodes
      # Repetition brake — prevent elaborate monoculture
      interview.strategy.self_count: -0.7
      # f965: specificity.low (0.4) + response_depth.surface (0.4) + response_depth.shallow (0.3)
      # all map to convgraph.node.llm.elaboration.low → merged 1.1 (preserves strong trigger intent)
      convgraph.node.llm.elaboration.low: 1.1

  # Strategy 2: Ascend — move upward through the chain toward solution
  # Binds to nodes with gap_above (nodes at L0-L3 that haven't been connected
  # upward through the chain). JTBD's "why does that matter?" laddering.
  # With 5 levels, ascend can target specific chain gaps:
  #   L0 context/trigger → L1 pain/gain → L2 job → L3 emotional/social → L4 solution
  # No valid_when gate — canonical slot nodes lack chain topology signals,
  # so hard-gating on gap.above would permanently dead-lock this strategy.
  # Signal weights (gap.above.true: 0.25) provide soft guidance instead.
  - name: ascend
    node_binding: required
    description: "Ladder from a functional job toward its emotional or social driver by asking why the job matters to the respondent"
    signal_weights:
      # Structural signal — gap_above is the primary trigger
      # Boosted from 0.25 to compete with probe_pain's structural mass
      convgraph.node.chain.gap.above.true: 0.5
      # Recency — prefer recently-discussed nodes for natural laddering flow
      convgraph.node.recency: 0.3
      # Generic baseline — level playing field with anchor/probe_pain
      # (essential because canonical slot nodes lack chain topology signals)
      convgraph.node.novelty.high: 0.25
      convgraph.node.focus.streak.none: 0.3
      convgraph.node.focus.count.none: 0.2
      # Exhaustion — avoid nodes already thoroughly explored
      convgraph.node.exhaustion: -0.6
      convgraph.node.focus.count.high: -0.4
      convgraph.node.focus.count.medium: -0.2
      # Chain foundation — boosted from 0.2 to 0.35 to equalize with ground's
      # has_attribute_foundation asymmetry (was 2:1 favoring ground, now symmetric)
      convgraph.node.chain.has_attribute_foundation.true: 0.35
      convgraph.node.chain.has_attribute_foundation.false: -0.5
      # Engagement — engaged respondent = safe to probe deeper
      response.semantic.llm.engagement.low: -0.3
      # f965: intellectual_engagement.high (0.2) → 0.5× elaboration.high + 0.5× charge.positive
      convgraph.node.llm.elaboration.high: 0.1
      convgraph.node.llm.charge.positive: 0.1
      # f965: response_depth.surface (0.1) + response_depth.shallow (0.05) → elaboration.low 0.15
      convgraph.node.llm.elaboration.low: 0.15
      # Mild repetition brake
      interview.strategy.self_count: -0.15

  # Strategy 3: Ground — find lower-level antecedents for higher-level nodes
  # Binds to nodes with gap_below (nodes at L1-L4 that lack chain-relevant
  # edges from lower levels). Asks "what triggers or causes this?"
  # With 5 levels, ground targets specific antecedent gaps:
  #   L4 solution → L3 emotional/social → L2 job → L1 pain/gain → L0 context/trigger
  # No valid_when gate — same canonical slot rationale as ascend.
  - name: ground
    node_binding: required
    description: "Ground an emotional or social job by exploring what functional circumstances, triggers, or job statements lead to it"
    signal_weights:
      # Structural signal — gap_below is the primary trigger
      # Boosted from 0.3 to compete with probe_pain's structural mass
      convgraph.node.chain.gap.below.true: 0.5
      # Recency — prefer recently-mentioned terminal nodes
      convgraph.node.recency: 0.3
      # Generic baseline — level playing field with anchor/probe_pain
      # (essential because canonical slot nodes lack chain topology signals)
      convgraph.node.novelty.high: 0.25
      convgraph.node.focus.streak.none: 0.3
      convgraph.node.focus.count.none: 0.2
      # Exhaustion — avoid over-probed nodes
      convgraph.node.exhaustion: -0.4
      # Chain foundation — reduced from 0.4 to 0.2 to remove structural
      # advantage over ascend (was 2:1 ratio, now symmetric)
      convgraph.node.chain.has_attribute_foundation.false: 0.2
      convgraph.node.chain.has_attribute_foundation.true: -0.2
      # f965: response.semantic.llm.response_depth.deep (0.05) → convgraph.node.llm.elaboration.high
      convgraph.node.llm.elaboration.high: 0.05
      # Repetition brake — doubled from -0.15 to -0.30 to prevent ground monoculture
      # (was plateauing at -0.15 which is dwarfed by 1.50+ positive mass)
      interview.strategy.self_count: -0.30

  # Strategy 4: Probe pain — identify frustrations and obstacles at orphan nodes
  # Replaces parts of legacy probe_alternatives and uncover_obstacles. Uses
  # is_orphan as a proxy for unconnected pain points (the most actionable kind).
  # Binds to isolated nodes that may represent frustrations not yet linked to
  # the graph.
  # No valid_when gate — same canonical slot rationale as ascend/ground.
  - name: probe_pain
    node_binding: required
    description: "Explore frustrations, obstacles, or unmet needs at isolated concepts — connect them to existing jobs and situations"
    signal_weights:
      # Structural signal — orphan node is the trigger
      convgraph.node.is_orphan.true: 0.50
      # Recency — prefer recently-mentioned orphans
      convgraph.node.recency: 0.2
      # Exhaustion — avoid exhausted nodes even if orphan
      convgraph.node.exhaustion: -0.4
      # f965: valence.low (0.3) → charge.negative; valence.mid (0.1) dropped (neutral band contributes 0)
      convgraph.node.llm.charge.negative: 0.3
      # f965: specificity.high (0.2) → convgraph.node.llm.elaboration.high
      convgraph.node.llm.elaboration.high: 0.2
      # Novelty — reduced from 0.4/0.5/0.3 to prevent probe_pain monoculture
      # (was 7× more positive mass than next competitor)
      convgraph.node.novelty.high: 0.2
      canongraph.node.novelty.new: 0.3
      canongraph.node.novelty.orphan: 0.2
      # Focus freshness — reduced from 0.5 (was firing on 94% of nodes)
      convgraph.node.focus.streak.none: 0.3
      convgraph.node.focus.streak.medium: -0.3
      convgraph.node.focus.streak.high: -0.6
      convgraph.node.focus.count.none: 0.2
      convgraph.node.focus.count.medium: -0.3
      convgraph.node.focus.count.high: -0.6
      # Repetition brake — strengthened from -0.15 to break monoculture streaks
      interview.strategy.self_count: -0.5

  # Strategy 5: Anchor — connect isolated concepts to existing graph structure
  # Replaces parts of legacy clarify_assumption. Pure structural strategy that
  # asks how an orphan node relates to existing jobs, contexts, or outcomes.
  # No valid_when gate — same canonical slot rationale as ascend/ground.
  - name: anchor
    node_binding: required
    description: "Connect an isolated concept to the existing graph by exploring how it relates to other known jobs, contexts, or outcomes"
    signal_weights:
      # Structural signal — orphan node is the trigger
      convgraph.node.is_orphan.true: 0.35
      # Recency — prefer recent orphans
      convgraph.node.recency: 0.2
      # Exhaustion — avoid exhausted orphans
      convgraph.node.exhaustion: -0.2
      # Engagement — need respondent engagement for relational questions
      response.semantic.llm.engagement.high: 0.1
      response.semantic.llm.engagement.low: -0.3
      # Novelty — fresh orphans are more interesting
      convgraph.node.novelty.high: 0.3
      canongraph.node.novelty.new: 0.3
      # Focus freshness — prefer unexplored orphans
      convgraph.node.focus.streak.none: 0.3
      convgraph.node.focus.count.none: 0.2
      # Mild repetition brake
      interview.strategy.self_count: -0.15

  # Strategy 6: Revitalize — conversation-level fatigue fallback
  # Same pattern as MEC strict's revitalize. No valid_when gate, no node binding.
  # Fires when engagement drops or responses trend shallow, shifting to fresh topics.
  - name: revitalize
    node_binding: none
    description: "Shift to fresh topics when response trend shows fatigue or repeated shallow answers"
    signal_weights:
      # Fatigue detection triggers
      response.semantic.llm.engagement.trend.fatigued: 1.0
      response.semantic.llm.engagement.trend.shallowing: 0.8
      # Engagement & valence triggers
      response.semantic.llm.engagement.low: 0.8
      response.semantic.llm.engagement.mid: 0.4
      response.semantic.llm.engagement.high: -0.4
      # f965: valence.low (0.5) + intellectual_engagement.low × 0.5 (0.1) → charge.negative 0.6
      convgraph.node.llm.charge.negative: 0.6
      # f965: intellectual_engagement.low × 0.5 (0.1) → elaboration.low (merged with specificity.low below)
      # Repetition — T2 + Critique: FLIPPED from +0.15 to -0.5
      # The +0.15 "escape valve" created runaway loops with brief responders:
      # brief → fatigue signal → revitalize → still brief → revitalize again
      interview.strategy.self_count: -0.5
      # High-streak brake: prevent revitalize loops at 3+ consecutive
      interview.strategy.self_count.high: -1.0
      # f965: specificity.low (-0.2) + intellectual_engagement.low × 0.5 (0.1) → elaboration.low -0.1
      convgraph.node.llm.elaboration.low: -0.1
      # Late-phase suppression — allow structural strategies to re-assert
      interview.phase.late: -0.5
      # Node-level signals — favor fresh territory
      convgraph.node.focus.streak.none: 0.8
      convgraph.node.focus.streak.medium: -0.4
      convgraph.node.focus.streak.high: -0.7
      convgraph.node.exhaustion.low: 0.5
      convgraph.node.novelty.high: 0.4
      convgraph.node.focus.count.high: -0.6
      convgraph.node.focus.count.medium: -0.3
      convgraph.node.focus.count.none: 0.3

  # Strategy 7: Validate — late-phase closing strategy
  # Replaces legacy validate_outcome. Heavy early/mid phase gate (-3.0) prevents
  # premature interview termination. Generates closing questions.
  - name: validate
    node_binding: none
    generates_closing_question: true
    focus_mode: summary
    description: "Confirm understanding and check if the most important aspects of the respondent's jobs and motivations have been captured"
    signal_weights:
      # Late-stage gate: prevent premature interview termination
      # generates_closing_question=true means this strategy ENDS the interview,
      # so it must not win before late phase. -3.0 overwhelms any positive triggers.
      interview.phase.early: -3.0
      interview.phase.mid: -3.0
      # Saturation triggers — high saturation = ready to validate
      meta.saturation.conversation: 0.3
      meta.saturation.canonical: 0.2
      # Uncertainty/hedging triggers — uncertain respondent = validate to confirm
      response.semantic.llm.certainty.low: 1.0
      response.semantic.llm.certainty.mid: 0.7
      # Engagement — low engagement suggests wrapping up
      response.semantic.llm.engagement.low: 0.6
      # f965: response_depth.deep (0.3) → elaboration.high; .moderate (0.2) → elaboration.mid
      convgraph.node.llm.elaboration.high: 0.3
      convgraph.node.llm.elaboration.mid: 0.2
      # Node-level — prefer well-connected nodes for validation
      convgraph.node.has_outgoing.true: 0.4
      convgraph.node.focus.streak.high: 0.5      # Often-focused = good summary target
      convgraph.node.novelty.high: 0.1
      convgraph.node.focus.count.high: -0.4       # But not so overused it's stale
      convgraph.node.focus.count.medium: -0.2
      canongraph.node.novelty.confirming: 0.2
      # Node extraction opportunity
      # Strategy repetition — lighter penalty; OK to re-validate
      interview.focus.streak.low: 0.3
      interview.strategy.self_count: -0.7

chain_completion:
  expected_branching:
    job_context: 2
    job_trigger: 2
    pain_point: 3
    gain_point: 2
    job_statement: 3
    emotional_job: 2
    social_job: 1
    solution_approach: 2
  # Very low threshold — JTBD tolerates incompleteness better than MEC.
  # A job statement without a solution is still valuable data.
  # Conversation-level strategies (elaborate, revitalize) activate early
  # to keep the interview breadth-oriented.
  score_threshold: 0.05

phases:
  early:
    description: "Initial exploration, building graph structure"
    # Early phase: prioritize breadth (elaborate) and structural grounding (ground).
    # Ascend is available but not dominant — need functional foundation first.
    # Anchor connects early orphans. Probe_pain surfaces initial frustrations.
    signal_weights:
      elaborate: 1.4          # Breadth-first: explore situations and contexts
      ground: 1.2             # Reduced from 1.4 to 1.2 — still prioritizes grounding but prevents runaway lead
      probe_pain: 1.2         # Surface early pain points
      anchor: 1.2             # Connect isolated concepts
      ascend: 1.0             # Available but not dominant
      revitalize: 1.0
      validate: 0.2           # Strongly suppressed — too early to wrap up
    phase_bonuses:
      elaborate: 0.2          # T2 calibration: increased from 0.1 to 0.2 to ensure breadth exploration

  mid:
    description: "Building depth and connections"
    # Mid phase: ascend and ground equalized to let node signals decide.
    # Probe_pain competes when valence is low. Anchor available for orphans.
    # Elaborate reduced to favor depth-building.
    signal_weights:
      ascend: 1.3             # Ladder toward emotional/social drivers
      ground: 1.3             # Find functional antecedents for terminal nodes
      probe_pain: 1.2         # Pain points often surface in mid-interview
      anchor: 1.0
      elaborate: 0.8          # Reduced — mid-phase should deepen, not just explore
      revitalize: 1.0
