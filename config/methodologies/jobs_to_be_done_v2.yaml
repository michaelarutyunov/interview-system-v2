# Jobs-to-be-Done Methodology Configuration (V2 — chain-aware architecture)
#
# Refitted from legacy JTBD (7 freeform strategies) to the new chain-aware
# architecture established by MEC strict. Key design decisions:
#
# Strategy redesign:
#   - 7 strategies → 7 strategies (different names, different contract model)
#   - Legacy strategies (explore_situation, probe_alternatives, dig_motivation,
#     validate_outcome, revitalize, uncover_obstacles, clarify_assumption)
#     replaced by chain-aware equivalents with valid_when gates
#   - Ontology unchanged (same 8 node types, same 7 edge types)
#
# Strategy mapping from legacy → chain-aware:
#   explore_situation    → elaborate   (breadth exploration, no gate)
#   probe_alternatives   → probe_pain  (re-targeted to pain points via is_orphan proxy)
#   dig_motivation       → ascend      (ladder from functional → emotional/social)
#   uncover_obstacles    → ground      (find functional antecedents for emotional/social jobs)
#   clarify_assumption   → anchor      (connect isolated concepts)
#   revitalize           → revitalize  (same fatigue-fallback pattern)
#   validate_outcome     → validate    (same late-phase closing strategy)
#
# Signal selection rationale:
#   - Reuses the same signal pools as MEC strict (llm, temporal, meta, graph)
#   - Chain topology signals (gap_above, gap_below, is_orphan) work because JTBD
#     has a 2-level hierarchy: functional nodes (level 0) and terminal nodes
#     (level 1) for emotional_job and social_job
#   - level_skip unlikely to fire (only 2 levels), so bridge strategy is omitted
#   - branching_deficit would only apply at level 0, omitted for simplicity
#   - graph.node.chain.has_attribute_foundation / has_terminal_apex retained for
#     structural grounding checks (checks whether chains have functional roots)
#
# Incompleteness tolerance:
#   JTBD tolerates incompleteness better than MEC — a job statement without an
#   emotional driver is still valuable. score_threshold set to 0.05 (vs 0.15 MEC)
#   so conversation-level strategies activate earlier, keeping the interview
#   breadth-oriented rather than depth-obsessed.

method:
  name: jobs_to_be_done_v2
  version: "2.0"
  goal: "Understand what jobs users are trying to accomplish and what motivates them"
  opening_bias: "Ask about a specific recent time they made a decision or change related to the topic."
  description: "Framework for understanding customer motivation and needs through job statements"

ontology:
  nodes:
    - name: job_statement
      level: 0
      terminal: false
      description: "Core functional or emotional job a customer is trying to accomplish"
      examples:
        - "get my daily caffeine fix"
        - "feel productive in the morning"
        - "socialize with colleagues"

    - name: job_context
      level: 0
      terminal: false
      description: "Situation or circumstances when the job arises"
      examples:
        - "when I'm rushing to work"
        - "when I'm working from home"
        - "when meeting clients"

    - name: job_trigger
      level: 0
      terminal: false
      description: "Event or stimulus that initiates the job"
      examples:
        - "feeling tired in the morning"
        - "anticipating a long meeting"
        - "hosting a gathering"

    - name: pain_point
      level: 0
      terminal: false
      description: "Obstacle or frustration in getting the job done"
      examples:
        - "coffee is too bitter"
        - "takes too long to prepare"
        - "upsets my stomach"

    - name: gain_point
      level: 0
      terminal: false
      description: "Desired outcome or benefit that makes the job worthwhile"
      examples:
        - "smooth, enjoyable taste"
        - "quick and convenient"
        - "feeling energized without jitters"

    - name: solution_approach
      level: 0
      terminal: false
      description: "Current or potential method for accomplishing the job"
      examples:
        - "using oat milk in coffee"
        - "buying coffee at a cafe"
        - "meal prepping"

    - name: emotional_job
      level: 1
      terminal: true
      description: "Emotional state or identity the customer seeks to achieve"
      examples:
        - "feel healthy and conscientious"
        - "project a professional image"
        - "treat myself with care"

    - name: social_job
      level: 1
      terminal: true
      description: "Social impression or relationship the customer wants to influence"
      examples:
        - "fit in with health-conscious peers"
        - "signal environmental values"
        - "avoid social awkwardness"

  edges:
    - name: occurs_in
      description: "Temporal or situational relationship between job and context"

    - name: triggers
      description: "Causal relationship where source initiates or causes target (A triggers B means A is the cause, B is the effect)"

    - name: addresses
      description: "Solution approach resolves a pain point or enables a gain point"

    - name: conflicts_with
      description: "Something that prevents or undermines something else"

    - name: enables
      description: "Something that makes something else more achievable or satisfying"

    - name: supports
      description: "Something that contributes to or reinforces something else"

    - name: revises
      description: "Contradiction - newer belief or approach supersedes older one"

  extraction_guidelines:
    - "Listen for phrases indicating what the user is trying to accomplish ('I need to...', 'I want to...', 'The goal is...')"
    - "Identify the circumstances when the job becomes important ('when...', 'especially when...', 'in situations like...')"
    - "Extract pain points directly expressed ('frustrating that...', 'hate it when...', 'problem is...')"
    - "Extract gain points as positive outcomes ('love that...', 'great because...', 'important that...')"
    - "Distinguish between functional, emotional, and social jobs - often all three coexist"
    - "Map the current solution approach even if not explicitly stated"
    - "Connect jobs to their underlying emotional and social drivers"
    - "Look for trade-offs users make between competing jobs"
    - "Actively extract emotional jobs: look for identity statements, feeling words, aspirational language"
    - "Actively extract social jobs: look for peer references, social signals, reputation concerns"

  relationship_examples:
    explicit_job_statement:
      description: "Direct statement of what needs to be accomplished"
      example: "I need something that wakes me up but doesn't make me jittery"
      extraction: "job_statement('wake up without jitters') → addresses → pain_point('caffeine jitters')"

    implicit_context:
      description: "Context revealed through situation description"
      example: "When I have 8am meetings, I can't wait in line at the cafe"
      extraction: "job_statement('get morning coffee') → occurs_in → job_context('early morning meetings')"

    pain_trigger_chain:
      description: "Trigger reveals the pain point and the job together"
      example: "Dairy makes me feel bloated, especially before presentations"
      extraction: "job_trigger('before presentations') → triggers → job_statement('feel comfortable') conflicts_with pain_point('dairy bloating')"

    functional_supports_emotional:
      description: "Functional choice enables emotional outcome"
      example: "I choose oat milk because it aligns with my values"
      extraction: "solution_approach('oat milk') → supports → emotional_job('feel environmentally responsible')"

  extractability_criteria:
    extractable_contains:
      - "Goals or objectives the user wants to achieve"
      - "Frustrations, pain points, or obstacles"
      - "Positive outcomes or benefits they value"
      - "Situational context (when, where, with whom)"
      - "Current solutions or workarounds"
      - "Emotions or social considerations related to choices"
    non_extractable_contains:
      - "Simple yes/no responses"
      - "Acknowledgments ('okay', 'I see', 'right')"
      - "Questions back to the interviewer"
      - "Purely factual product descriptions without user context"
      - "Irrelevant tangents"

  concept_naming_convention: >
    Name each concept according to its node type role:
    phrase job_statements as jobs to be done,
    pain_points as frustrations or obstacles,
    gain_points as desired outcomes or benefits,
    solution_approaches as methods or actions,
    job_contexts as situations or circumstances,
    emotional_jobs as emotional states sought,
    social_jobs as social outcomes desired,
    job_triggers as initiating events.
    Use the examples in each node type description as naming models.

signals:
  graph:
    - graph.node_count
    - graph.max_depth
    - graph.orphan_count
    - graph.chain_completion
    # Canonical graph signals (experimental)
    - graph.canonical_concept_count
    - graph.canonical_edge_density
    - graph.canonical_exhaustion_score
    # Note: Node-level chain topology signals (graph.node.gap_above, gap_below,
    # is_orphan, etc.) are auto-discovered from strategy signal_weights and
    # do not need to be listed here.

  llm:
    - llm.response_depth
    - llm.valence
    - llm.certainty
    - llm.specificity
    - llm.engagement
    - llm.intellectual_engagement
    # Note: llm.global_response_trend is session-scoped and managed separately

  temporal:
    - temporal.strategy_repetition_count
    - temporal.turns_since_strategy_change

  meta:
    - meta.interview.phase
    - meta.conversation.saturation
    - meta.canonical.saturation
    # Note: meta.interview_progress is intentionally excluded from JTBD.
    # Replaced by meta.conversation.saturation and meta.canonical.saturation
    # which are information-velocity-based rather than structural.

strategies:
  # Strategy 1: Elaborate — breadth exploration, conversation-level
  # Replaces legacy explore_situation. No valid_when gate, no node binding.
  # Fires when engagement is moderate and topics are fresh — keeps interview
  # exploring new ground rather than drilling into one chain.
  - name: elaborate
    node_binding: none
    description: "Explore new aspects of the respondent's experience — situations, contexts, and jobs that haven't been discussed yet"
    signal_weights:
      # Fatigue detection — suppress exploration during declining quality
      llm.global_response_trend.fatigued: -0.6
      llm.global_response_trend.shallowing: -0.4
      # Engagement — moderate engagement = breadth is productive
      llm.engagement.mid: 0.4
      llm.engagement.low: -0.3              # Disengaged respondent = don't explore
      # Novelty — favor fresh, unexplored territory
      graph.node.novelty.high: 0.6          # Recently-created nodes = rich territory
      graph.node.novelty.medium: 0.3
      graph.node.focus_streak.none: 0.6     # Nodes never focused on = prime targets
      graph.node.focus_streak.medium: -0.4
      graph.node.focus_streak.high: -0.7
      graph.node.focus_count.none: 0.3
      graph.node.focus_count.medium: -0.3
      graph.node.focus_count.high: -0.6
      graph.node.canonical_novelty.new: 0.5
      graph.node.canonical_novelty.orphan: 0.3
      graph.node.yield_stagnation.false: 0.5  # Nodes still yielding = productive
      graph.node.exhaustion_score.low: 0.4    # Avoid exhausted nodes
      # Repetition brake — prevent elaborate monoculture
      temporal.strategy_repetition_count: -0.7
      # Specificity — low specificity means respondent is still surface-level, explore is appropriate
      # T2 + Critique: boosted from 0.2 to 0.4 to strengthen trigger on brief answers
      llm.specificity.low: 0.4
      # Response depth — T2 + Critique: trigger elaboration on shallow answers
      # Routes brief answers to breadth exploration instead of revitalize fatigue loop
      llm.response_depth.surface: 0.4
      llm.response_depth.shallow: 0.3

  # Strategy 2: Ascend — move from functional job toward emotional/social driver
  # Replaces legacy dig_motivation. Binds to nodes with gap_above (functional
  # nodes that haven't been connected to an emotional or social job yet).
  # JTBD's "why does that matter?" laddering question.
  - name: ascend
    node_binding: required
    valid_when: graph.node.gap_above
    description: "Ladder from a functional job toward its emotional or social driver by asking why the job matters to the respondent"
    signal_weights:
      # Structural signal — gap_above is the primary trigger
      graph.node.gap_above.true: 0.25
      # Recency — prefer recently-discussed nodes for natural laddering flow
      graph.node.recency_score: 0.2
      # Exhaustion — avoid nodes already thoroughly explored
      graph.node.exhaustion_score: -0.6
      graph.node.focus_count.high: -0.4
      graph.node.focus_count.medium: -0.2
      # Chain foundation — T2 calibration: reduced from 0.4 to 0.2 to prevent ground dominance
      graph.node.chain.has_attribute_foundation.true: 0.2
      graph.node.chain.has_attribute_foundation.false: -0.5
      # Engagement — engaged respondent = safe to probe deeper
      llm.engagement.low: -0.3
      llm.intellectual_engagement.high: 0.2  # Analytical reasoning = productive target
      # Response depth — surface answers benefit from laddering
      llm.response_depth.surface: 0.1
      llm.response_depth.shallow: 0.05
      # Mild repetition brake
      temporal.strategy_repetition_count: -0.15

  # Strategy 3: Ground — find functional antecedents for emotional/social jobs
  # Replaces legacy uncover_obstacles. Binds to nodes with gap_below (terminal
  # nodes at level 1 that lack functional antecedents). Asks "what triggers or
  # causes this feeling/social need?"
  - name: ground
    node_binding: required
    valid_when: graph.node.gap_below
    description: "Ground an emotional or social job by exploring what functional circumstances, triggers, or job statements lead to it"
    signal_weights:
      # Structural signal — gap_below is the primary trigger
      graph.node.gap_below.true: 0.3
      # Recency — prefer recently-mentioned terminal nodes
      graph.node.recency_score: 0.25
      # Exhaustion — avoid over-probed nodes
      graph.node.exhaustion_score: -0.4
      # Chain foundation — prioritize ungrounded chains (no functional roots)
      graph.node.chain.has_attribute_foundation.false: 0.4
      graph.node.chain.has_attribute_foundation.true: -0.2
      # Depth signal — even moderate answers benefit from grounding
      llm.response_depth.deep: 0.05
      # Mild repetition brake
      temporal.strategy_repetition_count: -0.15

  # Strategy 4: Probe pain — identify frustrations and obstacles at orphan nodes
  # Replaces parts of legacy probe_alternatives and uncover_obstacles. Uses
  # is_orphan as a proxy for unconnected pain points (the most actionable kind).
  # Binds to isolated nodes that may represent frustrations not yet linked to
  # the graph.
  - name: probe_pain
    node_binding: required
    valid_when: graph.node.is_orphan
    description: "Explore frustrations, obstacles, or unmet needs at isolated concepts — connect them to existing jobs and situations"
    signal_weights:
      # Structural signal — orphan node is the trigger
      graph.node.is_orphan.true: 0.50
      # Recency — prefer recently-mentioned orphans
      graph.node.recency_score: 0.2
      # Exhaustion — avoid exhausted nodes even if orphan
      graph.node.exhaustion_score: -0.4
      # Valence — negative valence amplifies pain probing (respondent already frustrated)
      llm.valence.low: 0.3
      llm.valence.mid: 0.1
      # Specificity — concrete complaints are rich targets
      llm.specificity.high: 0.2
      # Novelty — newly-created orphan nodes are most likely pain points
      graph.node.novelty.high: 0.4
      graph.node.canonical_novelty.new: 0.5
      graph.node.canonical_novelty.orphan: 0.3
      # Focus freshness — prefer never-explored orphans
      graph.node.focus_streak.none: 0.5
      graph.node.focus_streak.medium: -0.3
      graph.node.focus_streak.high: -0.6
      graph.node.focus_count.none: 0.3
      graph.node.focus_count.medium: -0.3
      graph.node.focus_count.high: -0.6
      # Mild repetition brake
      temporal.strategy_repetition_count: -0.15

  # Strategy 5: Anchor — connect isolated concepts to existing graph structure
  # Replaces parts of legacy clarify_assumption. Pure structural strategy that
  # asks how an orphan node relates to existing jobs, contexts, or outcomes.
  - name: anchor
    node_binding: required
    valid_when: graph.node.is_orphan
    description: "Connect an isolated concept to the existing graph by exploring how it relates to other known jobs, contexts, or outcomes"
    signal_weights:
      # Structural signal — orphan node is the trigger
      graph.node.is_orphan.true: 0.35
      # Recency — prefer recent orphans
      graph.node.recency_score: 0.2
      # Exhaustion — avoid exhausted orphans
      graph.node.exhaustion_score: -0.2
      # Engagement — need respondent engagement for relational questions
      llm.engagement.high: 0.1
      llm.engagement.low: -0.3
      # Novelty — fresh orphans are more interesting
      graph.node.novelty.high: 0.3
      graph.node.canonical_novelty.new: 0.3
      # Focus freshness — prefer unexplored orphans
      graph.node.focus_streak.none: 0.3
      graph.node.focus_count.none: 0.2
      # Mild repetition brake
      temporal.strategy_repetition_count: -0.15

  # Strategy 6: Revitalize — conversation-level fatigue fallback
  # Same pattern as MEC strict's revitalize. No valid_when gate, no node binding.
  # Fires when engagement drops or responses trend shallow, shifting to fresh topics.
  - name: revitalize
    node_binding: none
    description: "Shift to fresh topics when response trend shows fatigue or repeated shallow answers"
    signal_weights:
      # Fatigue detection triggers
      llm.global_response_trend.fatigued: 1.0
      llm.global_response_trend.shallowing: 0.8
      meta.node.opportunity.exhausted: 0.3
      # Engagement & valence triggers
      llm.engagement.low: 0.8
      llm.engagement.mid: 0.4
      llm.engagement.high: -0.4
      llm.intellectual_engagement.low: 0.2  # Analytical disengagement = switch topics
      llm.valence.low: 0.5
      # Repetition — T2 + Critique: FLIPPED from +0.15 to -0.5
      # The +0.15 "escape valve" created runaway loops with brief responders:
      # brief → fatigue signal → revitalize → still brief → revitalize again
      temporal.strategy_repetition_count: -0.5
      # High-streak brake: prevent revitalize loops at 3+ consecutive
      temporal.strategy_repetition_count.high: -1.0
      # Specificity — low specificity alone should not trigger revitalize
      llm.specificity.low: -0.2
      # Late-phase suppression — allow structural strategies to re-assert
      meta.interview.phase.late: -0.5
      # Node-level signals — favor fresh territory
      graph.node.focus_streak.none: 0.8
      graph.node.focus_streak.medium: -0.4
      graph.node.focus_streak.high: -0.7
      graph.node.exhaustion_score.low: 0.5
      graph.node.novelty.high: 0.4
      graph.node.focus_count.high: -0.6
      graph.node.focus_count.medium: -0.3
      graph.node.focus_count.none: 0.3

  # Strategy 7: Validate — late-phase closing strategy
  # Replaces legacy validate_outcome. Heavy early/mid phase gate (-3.0) prevents
  # premature interview termination. Generates closing questions.
  - name: validate
    node_binding: none
    generates_closing_question: true
    focus_mode: summary
    description: "Confirm understanding and check if the most important aspects of the respondent's jobs and motivations have been captured"
    signal_weights:
      # Late-stage gate: prevent premature interview termination
      # generates_closing_question=true means this strategy ENDS the interview,
      # so it must not win before late phase. -3.0 overwhelms any positive triggers.
      meta.interview.phase.early: -3.0
      meta.interview.phase.mid: -3.0
      # Saturation triggers — high saturation = ready to validate
      meta.conversation.saturation: 0.3
      meta.canonical.saturation: 0.2
      # Uncertainty/hedging triggers — uncertain respondent = validate to confirm
      llm.certainty.low: 1.0
      llm.certainty.mid: 0.7
      # Engagement — low engagement suggests wrapping up
      llm.engagement.low: 0.6
      # Response depth — deep responses = enough material to validate
      llm.response_depth.deep: 0.3
      llm.response_depth.moderate: 0.2
      # Node-level — prefer well-connected nodes for validation
      graph.node.has_outgoing.true: 0.4
      graph.node.focus_streak.high: 0.5      # Often-focused = good summary target
      graph.node.novelty.high: 0.1
      graph.node.focus_count.high: -0.4       # But not so overused it's stale
      graph.node.focus_count.medium: -0.2
      graph.node.canonical_novelty.confirming: 0.2
      # Node extraction opportunity
      meta.node.opportunity.probe_deeper: 0.6
      # Strategy repetition — lighter penalty; OK to re-validate
      technique.node.strategy_repetition.low: 0.3
      temporal.strategy_repetition_count: -0.7

chain_completion:
  expected_branching:
    job_statement: 3
    job_context: 2
    job_trigger: 2
    pain_point: 3
    gain_point: 2
    solution_approach: 2
    emotional_job: 1
    social_job: 1
  # Very low threshold — JTBD tolerates incompleteness better than MEC.
  # A job statement without an emotional driver is still valuable data.
  # Conversation-level strategies (elaborate, revitalize) activate early
  # to keep the interview breadth-oriented.
  score_threshold: 0.05

phases:
  early:
    description: "Initial exploration, building graph structure"
    # Early phase: prioritize breadth (elaborate) and structural grounding (ground).
    # Ascend is available but not dominant — need functional foundation first.
    # Anchor connects early orphans. Probe_pain surfaces initial frustrations.
    signal_weights:
      elaborate: 1.4          # Breadth-first: explore situations and contexts
      ground: 1.4             # Actively establish functional foundation before ascending
      probe_pain: 1.2         # Surface early pain points
      anchor: 1.2             # Connect isolated concepts
      ascend: 1.0             # Available but not dominant
      revitalize: 1.0
      validate: 0.2           # Strongly suppressed — too early to wrap up
    phase_bonuses:
      elaborate: 0.2          # T2 calibration: increased from 0.1 to 0.2 to ensure breadth exploration

  mid:
    description: "Building depth and connections"
    # Mid phase: ascend and ground equalized to let node signals decide.
    # Probe_pain competes when valence is low. Anchor available for orphans.
    # Elaborate reduced to favor depth-building.
    signal_weights:
      ascend: 1.3             # Ladder toward emotional/social drivers
      ground: 1.3             # Find functional antecedents for terminal nodes
      probe_pain: 1.2         # Pain points often surface in mid-interview
      anchor: 1.0
      elaborate: 0.8          # Reduced — mid-phase should deepen, not just explore
      revitalize: 1.0
      validate: 0.5           # Becoming available but still suppressed

  late:
    description: "Validation and verification"
    # Late phase: validate dominates. Ascend available for final laddering.
    # Revitalize boosted to re-engage if fatigue sets in before wrap-up.
    signal_weights:
      validate: 1.5           # Primary late-phase strategy
      revitalize: 1.2         # Re-engage fatigued respondent for wrap-up
      ascend: 1.0             # Final laddering opportunities
      ground: 0.9             # Remaining grounding opportunities
      probe_pain: 1.1         # Surface any remaining frustrations
      anchor: 0.7
      elaborate: 0.3          # Minimal breadth — focus on consolidation
    phase_bonuses:
      validate: 0.2           # Ensure validation gets selected
      revitalize: 0.2         # Safety valve for late fatigue
