# Structural asymmetries — eval harness must factor these into cross-methodology interpretation.
# These are not richness defects; they are consequences of methodology choice.
structural_asymmetries:
  - dimension: H
    affected: [zerofizz_beverage_mec, zerofizz_beverage_rg]
    reason: "MEC is a vertical ladder; RG is cross-sectional contrast. Neither models temporal sequence."
    interpretation_warning: "Do not penalize MEC/RG for missing experience-arc content."
  - dimension: I
    affected: [zerofizz_beverage_jtbd, zerofizz_beverage_cit, zerofizz_beverage_cjm]
    reason: "JTBD/CIT/CJM ontologies have no dedicated values node; values surface implicitly via emotional/identity cues."
    interpretation_warning: "Do not penalize these concepts for missing explicit values statements."
  - dimension: F
    affected: [zerofizz_beverage_rg]
    reason: "RG requires an element set for triadic elicitation; contrast-set density is nominally higher by construction."
    interpretation_warning: "Do not interpret RG's 7 named alternatives as superior richness."

